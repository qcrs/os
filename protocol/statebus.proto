syntax = "proto3";

package statebus;

message StateRefLite {
  string state_id = 1;
  string kind = 2;
  uint64 length = 3;
}

message Hello {
  string agent_id = 1;
  string mode = 2;
  string protocol_version = 3;
}

message CapabilityItem {
  string name = 1;
  string kind = 2;
  string input_schema = 3;
  string output_schema = 4;
  repeated string accepted_state_kinds = 5;
  repeated string produced_state_kinds = 6;
}

message Capability {
  string agent_id = 1;
  repeated CapabilityItem items = 2;
}

message Ack {
  string related_id = 1;
  string detail = 2;
}

message Error {
  string code = 1;
  string detail = 2;
  string related_id = 3;
}

message Heartbeat {
  string agent_id = 1;
  int64 sent_at_ns = 2;
}

message PlanStep {
  string step_id = 1;
  string owner_agent = 2;
  string action = 3;
  repeated string input_state_refs = 4;
  string params_json = 5;
  repeated string depends_on = 6;
}

message Plan {
  string task_id = 1;
  string goal = 2;
  repeated PlanStep steps = 3;
}

message StepResult {
  string step_id = 1;
  bool success = 2;
  repeated StateRefLite output_state_refs = 3;
  string payload_json = 4;
  string error = 5;
  bool skipped = 6;
  string reused_from_memory_id = 7;
}

message MemoryQuery {
  string task_theme = 1;
  string query_text = 2;
  int32 top_k = 3;
  repeated string tags = 4;
  repeated string tags_any = 5;
  repeated string tags_all = 6;
  float min_confidence = 7;
  string source_agent_id = 8;
  int64 created_after_ns = 9;
  string encoder_id = 10;
  bool limit_active_only = 11;
  string required_metadata_json = 12;
}

message MemoryCommit {
  string memory_id = 1;
  string source_agent_id = 2;
  string source_task_id = 3;
  string task_theme = 4;
  string summary = 5;
  repeated string tags = 6;
  repeated string evidence_state_ids = 7;
  repeated string reusable_steps = 8;
  float confidence = 9;
  string embedding_state_id = 10;
  string encoder_id = 11;
  string metadata_json = 12;
  int64 created_at_ns = 13;
}

message WireEnvelope {
  oneof body {
    Hello hello = 1;
    Capability capability = 2;
    Ack ack = 3;
    Error error = 4;
    Heartbeat heartbeat = 5;
    Plan plan = 6;
    PlanStep plan_step = 7;
    StepResult step_result = 8;
    MemoryQuery memory_query = 9;
    MemoryCommit memory_commit = 10;
  }
}
