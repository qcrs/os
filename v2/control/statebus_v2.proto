syntax = "proto3";

package statebus.v2.control;

enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  REQ_EXEC = 1;
  ACK_RECV = 2;
  RUN_START = 3;
  HEARTBEAT = 4;
  RES_SUCC = 5;
  RES_ERR = 6;
  CMD_CANCEL = 7;
  TRAP_FATAL = 8;
  CMD_GC = 9;
  HELLO = 10;
  HELLO_ACK = 11;
}

message ControlHeader {
  string trace_id = 1;
  string task_id = 2;
  string step_id = 3;
  string attempt_id = 4;
  string target_role = 5;
  uint32 timeout_ms = 6;
  string schema_version = 7;
  EventType event_type = 8;
}

message RefHandle {
  string ref_id = 1;
  string ref_kind = 2;
}

message ReusePolicy {
  bool allow_assist = 1;
  bool allow_validated_replay = 2;
  bool allow_exact_replay = 3;
}

message LogitStateRefControl {
  string ref_id = 1;
  string schema_version = 2;
  string task_id = 3;
  string session_id = 4;
  string trace_id = 5;
  string step_id = 6;
  string request_id = 7;
  string attempt_id = 8;
  string storage_kind = 9;
  string shared_memory_name = 10;
  string mmap_relpath = 11;
  string blob_hash = 12;
  uint64 size_bytes = 13;
  string candidate_surface_digest = 14;
  string alias_mapping_digest = 15;
  uint32 candidate_count = 16;
  int64 producer_pid = 17;
  int64 lease_expires_at_ns = 18;
  string model_id = 19;
  string tokenizer_id = 20;
  string chat_template_sha256 = 21;
  string template_kwargs_sha256 = 22;
  string response_schema_digest = 23;
  string calibration_version = 24;
  string threshold_policy_version = 25;
  string gate_budget_version = 26;
  string policy = 27;
  string decision_type = 28;
  string dtype = 29;
  string byte_order = 30;
}

message LogitStateGrantControl {
  string schema_version = 1;
  string ref_id = 2;
  string task_id = 3;
  string session_id = 4;
  string trace_id = 5;
  string step_id = 6;
  string request_id = 7;
  string attempt_id = 8;
  string consumer_component = 9;
  int64 consumer_pid = 10;
  string candidate_surface_digest = 11;
  string alias_mapping_digest = 12;
  string calibration_version = 13;
  string threshold_policy_version = 14;
  string gate_budget_version = 15;
  string model_id = 16;
  string tokenizer_id = 17;
  string chat_template_sha256 = 18;
  string template_kwargs_sha256 = 19;
  string response_schema_digest = 20;
  int64 expires_at_ns = 21;
  string grant_token = 22;
}

message LogitGateResult {
  string schema_version = 1;
  string decision_id = 2;
  string action_token = 3;
  string ref_id = 4;
  string task_id = 5;
  string request_id = 6;
  int64 consumer_pid = 7;
  int64 producer_pid = 8;
  string action = 9;
  double selected_candidate_probability = 10;
  double entropy = 11;
  double normalized_entropy = 12;
  double top_margin = 13;
  double other_mass = 14;
  uint32 candidate_count = 15;
  string calibration_version = 16;
  string threshold_policy_version = 17;
  string gate_budget_version = 18;
  string reason = 19;
}

message Hello {
  ControlHeader header = 1;
  repeated string protocol_versions = 2;
  repeated string schema_versions = 3;
  string controller_registry_digest = 4;
  repeated string required_capability_ids = 5;
  int64 controller_pid = 6;
}

message HelloAck {
  ControlHeader header = 1;
  bool accepted = 2;
  string accepted_protocol_version = 3;
  string accepted_schema_version = 4;
  string worker_registry_digest = 5;
  repeated string supported_capability_ids = 6;
  string error_detail = 7;
  int64 worker_pid = 8;
}

message ExecRequest {
  ControlHeader header = 1;
  ReusePolicy reuse_policy = 2;
  repeated RefHandle state_refs = 3;
  repeated RefHandle artifact_refs = 4;
  repeated RefHandle memory_refs = 5;
  string runtime_reuse_contract = 6;
  string output_contract_version = 7;
  string workspace_root = 8;
  string input_manifest_hash = 9;
  string operation = 10;
  string state_root = 11;
  string hydrate_manifest_id = 12;
  uint32 semantic_top_k = 13;
  uint64 evidence_budget_bytes = 14;
  string expected_encoder_signature = 15;
  string capability_grant_hash = 16;
  string capability_grant_token = 17;
  string capability_grant_session_id = 18;
  LogitStateRefControl logit_state_ref = 19;
  LogitStateGrantControl logit_state_grant = 20;
  string logit_gate_policy_json = 21;
}

message AckReceived {
  ControlHeader header = 1;
  int64 acked_at_ns = 2;
}

message RunStart {
  ControlHeader header = 1;
  int64 started_at_ns = 2;
  uint32 heartbeat_interval_ms = 3;
  uint32 lease_timeout_ms = 4;
}

message Heartbeat {
  ControlHeader header = 1;
  int64 sent_at_ns = 2;
  string worker_state = 3;
}

message NumericSummaryResult {
  string input_ref_id = 1;
  string input_payload_hash = 2;
  uint64 row_count = 3;
  double total = 4;
  double mean = 5;
  double minimum = 6;
  double maximum = 7;
  string schema_digest = 8;
  string output_artifact_hash = 9;
  string validator_receipt_hash = 10;
  int64 worker_pid = 11;
  uint64 worker_compute_ns = 12;
}

message SuccessResult {
  ControlHeader header = 1;
  repeated RefHandle state_refs = 2;
  repeated RefHandle artifact_refs = 3;
  string output_contract_version = 4;
  int64 completed_at_ns = 5;
  string consumed_state_ref_id = 6;
  repeated string selected_candidate_ids = 7;
  repeated double selected_scores = 8;
  repeated uint32 selected_row_indices = 9;
  uint64 selected_evidence_bytes = 10;
  int64 consumer_pid = 11;
  int64 producer_pid = 12;
  string encoder_signature = 13;
  NumericSummaryResult numeric_summary = 14;
  LogitGateResult logit_gate_result = 15;
  string logit_grant_hash = 16;
  bool logit_action_reused = 17;
}

message ErrorResult {
  ControlHeader header = 1;
  string error_code = 2;
  string error_detail = 3;
  int64 failed_at_ns = 4;
}

message CancelCommand {
  ControlHeader header = 1;
  string reason = 2;
  int64 issued_at_ns = 3;
}

message TrapFatal {
  ControlHeader header = 1;
  string trap_reason = 2;
  string error_detail = 3;
  int64 trapped_at_ns = 4;
}

message GarbageCollectCommand {
  ControlHeader header = 1;
  repeated string ref_ids = 2;
  int64 issued_at_ns = 3;
}

message ControlEnvelope {
  oneof body {
    ExecRequest req_exec = 1;
    AckReceived ack_recv = 2;
    RunStart run_start = 3;
    Heartbeat heartbeat = 4;
    SuccessResult res_succ = 5;
    ErrorResult res_err = 6;
    CancelCommand cmd_cancel = 7;
    TrapFatal trap_fatal = 8;
    GarbageCollectCommand cmd_gc = 9;
    Hello hello = 10;
    HelloAck hello_ack = 11;
  }
}
