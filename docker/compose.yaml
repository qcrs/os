name: statebus-qcrs

services:
  statebus-dev:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: ${STATEBUS_DOCKER_TARGET:-embed}
      args:
        USER_NAME: ${STATEBUS_USER_NAME:-qcrs}
        USER_UID: ${STATEBUS_UID:-1000}
        USER_GID: ${STATEBUS_GID:-1000}
        STATEBUS_PIP_INDEX_URL: ${STATEBUS_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
        STATEBUS_TORCH_SPEC: ${STATEBUS_TORCH_SPEC:-torch==2.5.1}
        STATEBUS_TORCH_INDEX_URL: ${STATEBUS_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
    image: statebus-dev-openeuler:24.03-lts-sp3-${STATEBUS_DOCKER_TARGET:-embed}
    container_name: statebus-dev-qcrs
    init: true
    stdin_open: true
    tty: true
    network_mode: host
    shm_size: 1g
    working_dir: /workspace/statebus/project
    volumes:
      - ..:/workspace/statebus/project
      - ${HOME}/statebus/models:/statebus/models
      - ${HOME}/statebus/caches:/statebus/caches
      - ${HOME}/statebus/logs:/statebus/logs
      - ${HOME}/statebus/runs:/statebus/runs
      - ${HOME}/statebus/work:/statebus/work
      - ${HOME}/statebus/work/container-home/.local:/root/.local
      - ${HOME}/statebus/work/container-home/.local:/home/${STATEBUS_USER_NAME:-qcrs}/.local
      - ${STATEBUS_VLLM_MODELS_ROOT:-/data/models}:/data/models:ro
    environment:
      HOME: /root
      STATEBUS_HOME: /statebus
      STATEBUS_MODELS_DIR: /statebus/models
      STATEBUS_CACHES_DIR: /statebus/caches
      STATEBUS_LOGS_DIR: /statebus/logs
      STATEBUS_RUNS_DIR: /statebus/runs
      STATEBUS_WORK_DIR: /statebus/work
      STATEBUS_WORKSPACES_DIR: /statebus/work/workspaces
      STATEBUS_WORKDIR: /statebus/work
      STATEBUS_STATEPOOL_DIR: /statebus/work/statepool
      STATEBUS_PIP_INDEX_URL: ${STATEBUS_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      STATEBUS_TORCH_SPEC: ${STATEBUS_TORCH_SPEC:-torch==2.5.1}
      STATEBUS_TORCH_INDEX_URL: ${STATEBUS_TORCH_INDEX_URL:-https://download.pytorch.org/whl/cpu}
      NPM_CACHE: /statebus/caches/npm
      NPM_CONFIG_PREFIX: /root/.local
      PIP_CACHE_DIR: /statebus/caches/pip
      PIP_INDEX_URL: ${STATEBUS_PIP_INDEX_URL:-https://pypi.tuna.tsinghua.edu.cn/simple}
      HF_HOME: /statebus/caches/hf
      HUGGINGFACE_HUB_CACHE: /statebus/caches/hf/hub
      TRANSFORMERS_CACHE: /statebus/caches/hf/transformers
      SENTENCE_TRANSFORMERS_HOME: /statebus/caches/hf/sentence_transformers
      STATEBUS_LLM_CONFIG_FILE: ${STATEBUS_LLM_CONFIG_FILE:-/workspace/statebus/project/deploy/statebus_llm.local_vllm.example}
      STATEBUS_LLM_ENV_FILE: /workspace/statebus/project/deploy/statebus_llm.env.local
      STATEBUS_LOCAL_VLLM_BASE_URL: ${STATEBUS_LOCAL_VLLM_BASE_URL:-http://127.0.0.1:53334/v1}
      STATEBUS_LOCAL_VLLM_HEALTH_URL: ${STATEBUS_LOCAL_VLLM_HEALTH_URL:-http://127.0.0.1:53334/health}
      STATEBUS_VLLM_METRICS_URL: ${STATEBUS_VLLM_METRICS_URL:-http://127.0.0.1:53334/metrics}
      STATEBUS_VLLM_MODEL_PATH: ${STATEBUS_VLLM_MODEL_PATH:-/data/models/Qwen3-32B}
      STATEBUS_VLLM_TOKENIZER_PATH: ${STATEBUS_VLLM_TOKENIZER_PATH:-/data/models/Qwen3-32B}
      STATEBUS_KV_API_BASE_URL: ${STATEBUS_KV_API_BASE_URL:-http://127.0.0.1:53334}
      STATEBUS_KV_API_TOKEN_FILE: ${STATEBUS_KV_API_TOKEN_FILE:-}
      STATEBUS_ENGINE_LOCAL_KV_MODEL: ${STATEBUS_ENGINE_LOCAL_KV_MODEL:-qwen3-32b}
      STATEBUS_ENGINE_LOCAL_KV_PARENT_TOKENS: ${STATEBUS_ENGINE_LOCAL_KV_PARENT_TOKENS:-4096}
      STATEBUS_EMBED_DEVICE: ${STATEBUS_EMBED_DEVICE:-cpu}
      STATEBUS_STUDIO_EMBED_DEVICE: ${STATEBUS_STUDIO_EMBED_DEVICE:-cpu}
      STATEBUS_PREFIX_ALIGNMENT_MODE: ${STATEBUS_PREFIX_ALIGNMENT_MODE:-independent}
      STATEBUS_PREFIX_POLICY: ${STATEBUS_PREFIX_POLICY:-off}
      STATEBUS_LOGIT_GATE_MODE: ${STATEBUS_LOGIT_GATE_MODE:-off}
      STATEBUS_ENGINE_LOCAL_KV_MODE: ${STATEBUS_ENGINE_LOCAL_KV_MODE:-off}
