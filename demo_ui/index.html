<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CodeAct Demo · StateBus</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app">

      <!-- ── Header ─────────────────────────────────────────── -->
      <header class="app-header">
        <div class="header-brand">
          <span class="brand-eye">StateBus</span>
          <span class="brand-slash">/</span>
          <span class="brand-name">CodeAct Demo</span>
          <span class="header-badge" id="source-badge">加载中</span>
        </div>
        <div class="header-selectors">
          <label class="sel-label">任务组</label>
          <div class="chip-row" id="group-chips"></div>
          <label class="sel-label">样例</label>
          <div class="chip-row" id="sample-chips"></div>
        </div>
      </header>

      <!-- ── Tab Nav ────────────────────────────────────────── -->
      <nav class="tab-nav" role="tablist">
        <button class="tab-btn is-active" data-tab="pipeline" role="tab" aria-selected="true">链路演示</button>
        <button class="tab-btn" data-tab="compare" role="tab" aria-selected="false">效果对比</button>
        <button class="tab-btn" data-tab="trace" role="tab" aria-selected="false">执行样例</button>
        <div class="tab-ink" id="tab-ink"></div>
      </nav>

      <!-- ── Tab Panels ─────────────────────────────────────── -->
      <div class="tab-panels">

        <!-- Tab 1 · 链路演示 -->
        <section class="tab-pane is-active" id="tab-pipeline" role="tabpanel">
          <div class="pipeline-layout">

            <div class="pipeline-left">
              <div class="pipeline-canvas-wrap">
                <div id="main-chain"></div>
              </div>
              <footer class="pipeline-footer">
                <div class="footer-status">
                  <div class="pill-row" id="chain-replay-meta"></div>
                  <div class="status-text" id="chain-replay-status"></div>
                </div>
                <button class="action-btn" id="replay-chain-btn" type="button">▶ 执行对比（双次）</button>
              </footer>
              <div class="dual-result" id="dual-result"></div>
            </div>

            <aside class="pipeline-detail" id="chain-detail-card">
              <p class="detail-placeholder">点击链路中的节点查看详情</p>
            </aside>

          </div>
        </section>

        <!-- Tab 2 · 效果对比 -->
        <section class="tab-pane" id="tab-compare" role="tabpanel">
          <div class="compare-layout">

            <div class="why-codeact-row" id="why-codeact"></div>

            <div class="ki-row">
              <div class="ki-card amber">
                <div class="ki-num" id="ki-accuracy">—</div>
                <div class="ki-label">有 CodeAct 准确率</div>
                <div class="ki-note">同一 Structured 上下文下启用 CodeAct 的 overall accuracy</div>
              </div>
              <div class="ki-card teal">
                <div class="ki-num" id="ki-tokens-saved">—</div>
                <div class="ki-label">无 CodeAct 准确率</div>
                <div class="ki-note">同一 Structured 上下文下关闭 CodeAct 后的 overall accuracy</div>
              </div>
              <div class="ki-card blue">
                <div class="ki-num" id="ki-codeact-score">—</div>
                <div class="ki-label">多答对字段</div>
                <div class="ki-note">启用 CodeAct 后，相比关闭 CodeAct 多答对的字段数</div>
              </div>
            </div>

            <div class="protocol-row" id="compare-summary"></div>
            <div class="bars-section" id="compare-bars"></div>

          </div>
        </section>

        <!-- Tab 3 · 执行样例 -->
        <section class="tab-pane" id="tab-trace" role="tabpanel">
          <div class="trace-layout">

            <div class="trace-left">
              <div id="trace-card"></div>
              <div class="stabs" id="sample-tabs"></div>
              <div class="stab-panel" id="sample-tab-panel"></div>
            </div>

            <div class="trace-right">
              <div class="code-head">
                <h3>Execution Code</h3>
                <span class="code-tag">Real Trace</span>
              </div>
              <pre id="code-block"></pre>
            </div>

          </div>
        </section>

      </div><!-- /tab-panels -->
    </div><!-- /app -->

    <script type="module" src="./app.js"></script>
  </body>
</html>
