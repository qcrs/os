task_set:
  name: pure_text_open_smoke_v1_pack
  pack_type: ad_hoc
  description: Minimal smoke pack for the external pure-text open baseline.
  reading_contract: Read this pack only as a tiny API smoke surface. It exists to verify the external pure-text baseline can run, produce readable outputs, and keep the task set intentionally small.
  claim_lanes: [communication, state_transfer]
  single_variable: false
  variable_axes: [mode, handoff_object]
  public_surface: pure_text_open_smoke_v1
  evidence_tier: audit_only
  benchmark_version: v3

tasks:
  - task_id: pure-text-open-smoke-checkout-001
    task_group: pure_text_open_smoke
    task_order: 1
    task_theme: contest_release_checkout_regression
    benchmark_lane: state_transfer
    allowed_modes: [text]
    corpus_path: contest_release_regression_corpus.yaml
    goal: Use the cited release artifacts to triage the checkout regression and recommend the first action.
    query: checkout release 17.4 canary shows connection pool waits and slow orders query after rollout
    corpus_doc_ids: [rr-checkout-incident, rr-checkout-metrics, rr-checkout-logs]
    evidence_text: Use only the referenced release artifacts. This is the tiny smoke row for the external pure-text baseline.
    tags: [release, checkout, latency, database, smoke]
    reuse_tags: [release, checkout, database]
    expected_reuse_mode: none
    runtime_reuse_contract: reuse_disabled
    summary_hint: 'Return four concise points only: most likely cause, strongest competing explanation ruled out, first action, and first validation check.'
    transfer_strategy: text_strict_pure_lane
    handoff_profile: text_strict_pure_lane
    complexity_bucket: simple
    summary_contract: actions_plus_evidence
    case_id: pure-text-open-smoke-checkout
    case_type: exact_single_solution
    eval_scope: case_level
    expected_family: db_pool_saturation
    primary_expected_route: db_pool_saturation
    primary_expected_tool: tool.db_pool_triage
    acceptable_routes: [db_pool_saturation]
    acceptable_tools: [tool.db_pool_triage]
    disallowed_families: []
    abstention_allowed: false
    allowed_abstain_tool: ""
    abstain_only_when: ""

  - task_id: pure-text-open-smoke-auth-001
    task_group: pure_text_open_smoke
    task_order: 2
    task_theme: contest_release_auth_rotation
    benchmark_lane: state_transfer
    allowed_modes: [text]
    corpus_path: contest_release_regression_corpus.yaml
    goal: Use the cited release artifacts to diagnose auth callback failures after metadata rotation.
    query: auth metadata rotation canary shows issuer mismatch stale jwks and repeated callback verification failures
    corpus_doc_ids: [rr-auth-incident, rr-auth-metrics, rr-auth-logs]
    evidence_text: Use only the referenced release artifacts. This is the tiny smoke row for the external pure-text baseline.
    tags: [release, auth, session, jwks, smoke]
    reuse_tags: [release, auth, session]
    expected_reuse_mode: none
    runtime_reuse_contract: reuse_disabled
    summary_hint: 'Return four concise points only: root cause, strongest competing explanation ruled out, first action, and validation check.'
    transfer_strategy: text_strict_pure_lane
    handoff_profile: text_strict_pure_lane
    complexity_bucket: simple
    summary_contract: actions_plus_evidence
    case_id: pure-text-open-smoke-auth
    case_type: exact_single_solution
    eval_scope: case_level
    expected_family: auth_session_drift
    primary_expected_route: auth_session_drift
    primary_expected_tool: tool.auth_session_repair
    acceptable_routes: [auth_session_drift]
    acceptable_tools: [tool.auth_session_repair]
    disallowed_families: []
    abstention_allowed: false
    allowed_abstain_tool: ""
    abstain_only_when: ""
