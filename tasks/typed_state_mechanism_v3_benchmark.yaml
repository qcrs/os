task_set:
  name: typed_state_mechanism_v3_pack
  pack_type: typed_state_mechanism_v3
  description: Protocol-only single-variable mechanism pack for natural handoff text versus minimal typed-state packet on the same contest-release cases.
  reading_contract: Read this pack only as the protocol-side typed-state mechanism surface. It fixes mode=protocol, runtime_reuse_contract=reuse_disabled, and the same task object, then compares natural_handoff_text against state_packet_minimal.
  claim_lanes:
  - state_transfer
  single_variable: true
  variable_axes:
  - handoff_object
  public_surface: formal_secondary
  plan_source_default: yaml
  evidence_tier: formal_secondary
  benchmark_version: v3
tasks:
- task_group: checkout_release_chain
  task_order: 1
  task_theme: contest_release_checkout_regression
  benchmark_lane: state_transfer
  allowed_modes:
  - protocol
  corpus_path: contest_release_regression_corpus.yaml
  goal: Use the cited release artifacts to triage the checkout regression and recommend the first action.
  query: checkout release 17.4 canary shows connection pool waits and slow orders query after rollout
  corpus_doc_ids:
  - rr-checkout-incident
  - rr-checkout-metrics
  - rr-checkout-logs
  - rr-checkout-worker-false
  evidence_text: Use only the referenced release artifacts; compare protocol natural handoff text against the minimal typed-state packet only and keep memory reuse disabled.
  tags:
  - release
  - checkout
  - latency
  - database
  - clean
  - typed-state-mechanism
  reuse_tags:
  - release
  - checkout
  - database
  expected_reuse_mode: none
  runtime_reuse_contract: reuse_disabled
  summary_hint: 'Return four concise points only: most likely cause, strongest competing explanation ruled out, first action, and first validation check.'
  task_id: rr-checkout-clean-natural-handoff-001
