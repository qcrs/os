    task_order: 1
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: reuse_disabled
    goal: Verify that latency worker-queue retrieval still wins under wrong-family task context and a widened mixed preferred doc set.
    query: release-17 latency tls reload worker queue stall not database
    corpus_doc_ids: [cache-invalid-anchor, session-auth-anchor, latency-db-anchor]
    evidence_text: This retrieval diagnostic uses a widened mixed doc set plus cache-family task context, but the query evidence should still surface the latency worker-queue route.
    tags: [latency, database, orders]
    reuse_tags: [latency, database, orders]
    expected_reuse_mode: none
    summary_hint: >
      This retrieval diagnostic should still surface the latency worker-queue
      route even though preferred docs mix cache, session, and the in-family DB
      path.

