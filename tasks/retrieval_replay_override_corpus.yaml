docs:
  - doc_id: exec-override-hint-anchor
    task_group: replay_override_diag
    task_theme: executor_override_rate_limit
    title: Session-labeled incident whose note actually points to auth rate limiting
    tags: [auth, session]
    route_hint: auth_session_drift
    tool_name: tool.auth_session_repair
    text: >
      The incident is still labeled as a session-side callback issue, but the
      actual note now points to an auth rate limiter with an aggressive backoff
      window. Login recovery resumes only after lowering auth rate limiting and
      clearing the affected backoff window.

