task_set:
  name: open_planner_support_pack
  pack_type: open_planner_support
  description: Archived historical support surface for the earlier open-planner-only regression pack.
  reading_contract: Read this pack only as archived historical support material for the earlier open-planner surface. It must not be mixed into the current v3 communication, state_transfer, memory, or planner-control claims.
  claim_lanes: []

tasks:
  - task_id: open-planner-checkout-001
    task_group: open_planner_support_lane
    task_order: 1
    task_theme: contest_release_checkout_regression
    plan_source: llm
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: reuse_disabled
    allowed_modes: [text, protocol]
    corpus_path: contest_release_regression_corpus.yaml
    goal: Use planner-generated steps to diagnose the checkout canary regression and recommend the first action.
    query: checkout release 17.4 canary shows connection pool waits and slow orders query after rollout
    corpus_doc_ids: [rr-checkout-incident, rr-checkout-metrics, rr-checkout-logs, rr-checkout-worker-false]
    evidence_text: This support task verifies Planner LLM plan compilation; ignore memory reuse and keep the runtime path otherwise unchanged.
    tags: [release, checkout, latency, database, open-planner]
    reuse_tags: [release, checkout, database]
    expected_reuse_mode: none
    expected_route: db_pool_saturation
    expected_tool_name: tool.db_pool_triage
    expected_top_doc_id: rr-checkout-incident
    summary_hint: Return root cause, strongest competing explanation ruled out, first action, and validation check.

