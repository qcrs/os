task_set:
  name: typed_state_full_rich_audit_v3_pack
  pack_type: typed_state_full_rich_audit_v3
  description: V3 support-only full-rich typed-state audit pack for protocol-side natural-text versus explicit full-rich audit typed-state comparisons.
  reading_contract: Read this pack only as the v3 full-rich typed-state audit pack. It compares protocol_natural_handoff_text against protocol_full_rich_audit under matched retrieval inputs and must not be read as the mainline typed-state contract.
  claim_lanes: [state_transfer]
  evidence_tier: support_only
  benchmark_version: v3

