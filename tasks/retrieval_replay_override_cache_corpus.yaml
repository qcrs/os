docs:
  - doc_id: cache-override-hint-anchor
    task_group: replay_override_cache_diag
    task_theme: cache_override_replica
    title: Invalidation-labeled cache incident whose note actually points to replica lag
    tags: [cache, inventory, invalidation]
    route_hint: cache_invalidation
    tool_name: tool.cache_invalidation_playbook
    text: >
      The incident is still labeled as an invalidation problem, but the actual
      note points to read replica lag after failover and stale reads on the
      replica path rather than a missed invalidation hook.

  - doc_id: cache-override-replica-evidence
    task_group: replay_override_cache_diag
    task_theme: cache_override_replica
    title: Clear replica-lag evidence that conflicts with the invalidation hint
    tags: [cache, inventory, replica, failover]
    route_hint: ""
    tool_name: ""
    text: >
      The strongest evidence points to a lagging reporting replica after
      failover. The invalidation hook fired on time; the actual problem is stale
      reads on the replica path.

  - doc_id: cache-override-replica-followup
    task_group: replay_override_cache_diag
    task_theme: cache_override_replica
    title: Follow-up note confirms the same replica-lag route
    tags: [cache, inventory, replica, failover]
    route_hint: ""
    tool_name: ""
    text: >
      A second note again points to replica lag and stale reads on the replica
      path rather than an invalidation-side bug.
