tasks:
  - task_id: diag-retrieval-theme-variant-latency-db-001
    task_group: latency_chain
    task_order: 1
    task_theme: repo_local_latency_triage_variant
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: reuse_disabled
    goal: Verify that a weak latency-family query still returns the DB route even when task_theme drifts to a variant label.
    query: release-17 latency issue
    corpus_doc_ids: [cache-invalid-anchor, session-auth-anchor, latency-db-anchor]
    evidence_text: This retrieval diagnostic changes only task_theme to a variant label while keeping the weak latency query and preferred DB doc fixed.
    tags: [latency]
    reuse_tags: [latency]
    expected_reuse_mode: none
    summary_hint: >
      This retrieval diagnostic should keep the DB route on top; task_theme
      variant drift alone should not materially change current retrieval.

