task_set:
  name: contest_dual_mode_controlled_v3_pack
  pack_type: contest_dual_mode_controlled_v3
  description: V3 formal dual-mode controlled pack with matched strict pure-text and
    minimal typed-state protocol rows on the same 20 contest-release cases.
  reading_contract: Read this pack only as the formal v3 dual-mode controlled pack.
    Each pair keeps the same family, query, evidence universe, summary contract, and
    plan source fixed; mode and handoff object differ together, so this is a controlled
    composite comparison rather than a single-variable external pure-text baseline.
  claim_lanes:
  - communication
  - state_transfer
  single_variable: false
  variable_axes:
  - mode
  - handoff_object
  public_surface: formal_headline
  plan_source_default: yaml
  evidence_tier: formal_headline
  benchmark_version: v3
  formal_structure_clean_retrieval: true
corpus_metadata:
  formal_structure_clean: true
families:
- family_id: auth_rotation
  task_theme: contest_release_auth_rotation
  task_group: auth_rotation_chain
  goal: Use the cited release artifacts to triage the auth regression and recommend
    the first action.
  route_competition:
  - auth_rate_limit
  - auth_session_drift
  tool_competition:
  - tool.auth_jwks_refresh
  - tool.auth_rate_limit_triage
  - tool.auth_session_repair
  - tool.collect_more_evidence
  reuse_tags:
  - release
  - auth
  - session
  docs:
    ambiguous:
      doc_id: rr-auth-ambiguous
      title: Ambiguity note keeps rate-limit triage admissible until drift is confirmed
      tags:
      - release
      - auth
      - ambiguous
      - rate-limit
      - session
      eval_route_label: auth_session_drift
      eval_tool_label: tool.auth_session_repair
      text: A later note records a mild throttle rise on one edge slice. It says the
        session-drift route stays primary, but rate-limit triage remains admissible
        until the callback drift evidence is carried forward.
    incident:
      doc_id: rr-auth-incident
      title: Callback failures rose after auth metadata rotation
      tags:
      - release
      - auth
      - incident
      - callback
      - session
      eval_route_label: auth_session_drift
      eval_tool_label: tool.auth_session_repair
      text: After the metadata rotation, callback failures and forced sign-outs rose
        on the auth canary. The incident note says the failures cluster in one slice
        of traffic, with callback verification failures, stale jwks cache hits, issuer
        mismatch symptoms, and session drift appearing together, but does not fully
        close whether the main issue is session drift or a throttling control.
    logs:
      doc_id: rr-auth-logs
      title: Logs show issuer mismatch while callback retries stay local
      tags:
      - release
      - auth
      - logs
      - session
      - jwks
      eval_route_label: auth_session_drift
      eval_tool_label: tool.auth_session_repair
      text: The logs show issuer mismatch lines and stale metadata refresh lag on
        the callback path. They do not show a service-wide throttle spiral.
    metrics:
      doc_id: rr-auth-metrics
      title: Metrics show callback verification drift without broad throttle pressure
      tags:
      - release
      - auth
      - metrics
      - session
      - jwks
      eval_route_label: auth_session_drift
      eval_tool_label: tool.auth_session_repair
      text: The dashboard shows callback verification failures and stale metadata
        cache hits climbing together. Broad throttle counters stay near baseline during
        the same window.
    rate-limit-false:
      doc_id: rr-auth-rate-limit-false
      title: Earlier login failures were caused by an aggressive throttle window
      tags:
      - release
      - auth
      - distractor
      - rate-limit
      - queue
      eval_route_label: auth_rate_limit
      eval_tool_label: tool.auth_rate_limit_triage
      text: A previous auth incident came from a bad throttle window and aggressive
        backoff. That case did not show stale metadata drift or issuer mismatch on
        the callback path, stale jwks refresh loss, or session drift on callback verification.
    reuse:
      doc_id: rr-auth-reuse
      title: Follow-up note requires inherited rejection of pure throttle regression
      tags:
      - release
      - auth
      - reusable
      - scope
      - validation
      eval_route_label: auth_session_drift
      eval_tool_label: tool.auth_jwks_refresh
      text: The reusable follow-up says the scoped JWKS refresh is safe only if the
        prior case already rejected a pure throttle regression. Without that carried-forward
        rejection, the safe action is to gather more evidence.
    rotation:
      doc_id: rr-auth-rotation
      title: Rotation runbook distinguishes stale-session repair from rate-limit triage
      tags:
      - release
      - auth
      - runbook
      - structural-anchor
      - jwks
      eval_route_label: auth_session_drift
      eval_tool_label: tool.auth_jwks_refresh
      text: The post-rotation runbook says to refresh JWKS and clear stale session
        cookies when callback verification drifts after metadata rotation. It says
        to use rate-limit triage only when throttle counters drive the loss.
    scope:
      doc_id: rr-auth-scope
      title: Scope note limits failures to tenants with cached pre-rotation sessions
      tags:
      - release
      - auth
      - scope
      - session
      - canary
      eval_route_label: auth_session_drift
      eval_tool_label: tool.auth_session_repair
      text: The scope note limits failures to tenants carrying pre-rotation sessions
        into the canary. The same scope note says the affected slice lines up with
        stale pre-rotation sessions rather than a broad throttle spiral, so any first
        action should stay inside that tenant slice until the throttle hypothesis
        is rejected.
