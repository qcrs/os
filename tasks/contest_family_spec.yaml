      - tool.auth_rate_limit_triage
      disallowed_families: []
      required_prior_case_ids: []
      required_prior_rejections: []
      abstention_allowed: false
      allowed_abstain_tool: ''
      abstain_only_when: ''
      text_evidence_text: Use only the referenced release artifacts. This row is the
        strict pure-text formal baseline.
      protocol_evidence_text: Use only the referenced release artifacts. This row
        is the matched minimal typed-packet protocol baseline.
      tags:
      - release
      - auth
      - session
      - clean
      reuse_tags:
