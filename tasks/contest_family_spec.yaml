      - metrics
      - logs
      - rate-limit-false
      thickness_setting: S1
      reasoning_hops_min: 2
      dependency_depth: 1
      required_prior_routes: []
      abstention_boundary: Validation must collapse route competition before execution;
        collect-more-evidence is not score-valid on the clean slice.
      expected_intermediate_decisions:
      - keep the primary and competing routes explicit after retrieval
      - validate the primary route against scope and artifact evidence before execution
      - choose the narrowest first action only after validation closes the competing
