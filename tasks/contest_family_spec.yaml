      text: A later review notes one short replica-lag spike near the same window.
        It says invalidation remains primary, but replica triage stays admissible
        until the refresh-loss signal is explicitly preserved.
    flag-diff:
      doc_id: rr-cache-flag-diff
      title: Flag diff moved aggregate refresh behind the new sync orchestration path
      tags:
      - release
      - inventory
      - config
      - structural-anchor
      - cache
      eval_route_label: cache_invalidation
      eval_tool_label: tool.cache_hook_repair
      text: The feature-flag diff moved aggregate refresh behind the new sync path.
        The rollout note says to repair the hook and rerun sync validation if the
        stale-count issue appears without replica lag.
    incident:
      doc_id: rr-cache-incident
      title: Inventory counts stayed stale after a rollout-region sync window
      tags:
      - release
      - inventory
      - incident
      - cache
      - sync-window
      eval_route_label: cache_invalidation
      eval_tool_label: tool.cache_invalidation_playbook
      text: After the new sync path reached one rollout region, inventory counts on
        the read side stayed stale after batch sync. The incident note says aggregate-refresh
        updates are missing on the new sync path while writes stay healthy, with cache
        invalidation loss, aggregate invalidation misses, and invalidation hook skips
        appearing together, but does not yet fully close whether the primary cause
        is invalidation loss or stale replica reads.
    logs:
      doc_id: rr-cache-logs
      title: Logs show aggregate-refresh skips on the new sync path
      tags:
      - release
      - inventory
      - logs
      - cache
      - invalidation
      eval_route_label: cache_invalidation
      eval_tool_label: tool.cache_invalidation_playbook
      text: The logs show repeated skip lines around the aggregate-refresh hook on
        the new sync path. They do not show persistent replica lag through the same
        interval.
    metrics:
      doc_id: rr-cache-metrics
      title: Metrics show stale read-side counters while write success remains healthy
      tags:
      - release
      - inventory
      - metrics
      - cache
      - invalidation
      eval_route_label: cache_invalidation
      eval_tool_label: tool.cache_invalidation_playbook
      text: The metrics view shows healthy writes while read-side counters stay stale
        after sync. The aggregate-refresh rate drops in the same window.
    replica-false:
      doc_id: rr-cache-replica-false
      title: Another stale-count incident was caused by lagging read replicas
      tags:
      - release
      - inventory
      - distractor
      - replica
      - cache
      eval_route_label: cache_replica_stale_read
      eval_tool_label: tool.replica_stale_read_triage
      text: A separate stale-count incident was driven by read replica lag after a
        failover. That case did not include skipped aggregate-refresh evidence, cache
        invalidation loss, or invalidation hook skips.
    reuse:
