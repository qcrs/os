tasks:
  - task_id: diag-retrieval-session-context-rate-limit-001
    task_group: cache_chain
    task_order: 1
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: reuse_disabled
    goal: Verify that retrieval can surface the rate-limit auth route even when task_group, task_theme, and preferred docs all point to the cache family.
    query: login failures from aggressive backoff window and auth rate limiter
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-followup]
    evidence_text: This retrieval diagnostic uses cache-family task context and preferred docs, but the query evidence points to the auth rate-limit route.
    tags: [auth, session, rate-limit]
    reuse_tags: [auth, session, rate-limit]
    expected_reuse_mode: none
    summary_hint: >
      This retrieval diagnostic should still surface the auth rate-limit route
      even though task context and preferred docs both point to the cache family.

