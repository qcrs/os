task_set:
  name: typed_state_authenticity_v3_pack
  pack_type: typed_state_authenticity_v3
  description: V3 legacy-compat formal-secondary typed-state authenticity pack for
    protocol-side natural-text versus state_packet_minimal comparisons.
  reading_contract: Read this pack only as the v3 minimal typed-state authenticity
    pack. It compares natural handoff text against state_packet_minimal
    DENSE_EVIDENCE + EXECUTOR_DECISION_PACKET under matched retrieval inputs and
    must not be read as a whole-lane text baseline or rich-state efficiency proof.
    Keep this pack for legacy compatibility; active mechanism claims should read
    typed_state_mechanism_v3 first.
  claim_lanes:
  - state_transfer
  single_variable: true
  variable_axes:
  - handoff_object
  public_surface: formal_secondary
  plan_source_default: yaml
  evidence_tier: formal_secondary
  benchmark_version: v3
tasks:
- task_group: checkout_release_chain
  task_order: 1
  task_theme: contest_release_checkout_regression
  benchmark_lane: state_transfer
  allowed_modes:
  - protocol
  corpus_path: contest_release_regression_corpus.yaml
  goal: Use the cited release artifacts to triage the checkout regression and recommend
    the first action.
  query: checkout release 17.4 canary shows connection pool waits and slow orders
    query after rollout
  corpus_doc_ids:
  - rr-checkout-incident
  - rr-checkout-metrics
  - rr-checkout-logs
  - rr-checkout-worker-false
  evidence_text: Use only the referenced release artifacts; compare natural free-text
    handoff against typed state handoff only and ignore memory reuse.
  tags:
  - release
  - checkout
  - latency
  - database
  - clean
  - transfer-authenticity
  reuse_tags:
  - release
  - checkout
  - database
  expected_reuse_mode: none
  runtime_reuse_contract: reuse_disabled
  summary_hint: 'Return four concise points only: most likely cause, strongest competing
    explanation ruled out, first action, and first validation check.'
  task_id: rr-checkout-clean-pure-text-001
  transfer_strategy: natural_handoff_text
  complexity_bucket: simple
  summary_contract: protocol_handoff_audit
