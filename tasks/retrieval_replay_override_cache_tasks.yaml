tasks:
  - task_id: diag-replay-override-cache-anchor-001
    task_group: replay_override_cache_diag
    task_order: 1
    task_theme: cache_override_replica
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: reuse_disabled
    goal: Build a cache lexical-override replay anchor with a conflicting invalidation hint and clear replica-lag evidence.
    query: replica lag stale reads after failover
    corpus_path: retrieval_replay_override_cache_corpus.yaml
    corpus_doc_ids: [cache-override-hint-anchor, cache-override-replica-evidence]
    evidence_text: This replay override diagnostic builds a cache lexical-override anchor.
    tags: [cache, inventory, replica, failover]
    reuse_tags: [cache, inventory, replica, failover]
    expected_reuse_mode: none
    summary_hint: >
      This replay override diagnostic should keep the replica stale-read playbook
      even though the hinted document points at invalidation.

  - task_id: diag-replay-override-cache-validated-001
    task_group: replay_override_cache_diag
    task_order: 2
    task_theme: cache_override_replica
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: validated_replay
    goal: Verify that cache lexical-override provenance still allows validated replay when fresh retrieval matches.
    query: replica lag stale reads after failover
    corpus_path: retrieval_replay_override_cache_corpus.yaml
    corpus_doc_ids: [cache-override-hint-anchor, cache-override-replica-evidence]
    evidence_text: This replay override diagnostic checks cache validated replay under lexical-override provenance.
    tags: [cache, inventory, replica, failover]
    reuse_tags: [cache, inventory, replica, failover]
    expected_reuse_mode: skip_execute
    summary_hint: >
      This replay override diagnostic should still allow execute pruning because
      the fresh retrieval confirms the same replica-lag route and evidence slice.

  - task_id: diag-replay-override-cache-exact-001
    task_group: replay_override_cache_diag
    task_order: 3
    task_theme: cache_override_replica
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: exact_replay
    goal: Verify that cache lexical-override provenance still allows exact replay when query and route stay aligned.
    query: replica lag stale reads after failover
    corpus_path: retrieval_replay_override_cache_corpus.yaml
    corpus_doc_ids: [cache-override-hint-anchor, cache-override-replica-evidence]
    evidence_text: This replay override diagnostic checks cache exact replay under lexical-override provenance.
    tags: [cache, inventory, replica, failover]
    reuse_tags: [cache, inventory, replica, failover]
    expected_reuse_mode: skip_retrieve_execute
    summary_hint: >
      This replay override diagnostic should allow exact replay because the
      archived route remains lexical-led even though the metadata hint conflicts.
