task_set:
  name: route_corpus_stress_audit_v1_pack
  pack_type: route_corpus_stress_audit_v1
  description: Audit-only route/corpus stress pack for testing route-label and local-corpus shaping sensitivity outside the frozen headline.
  reading_contract: Read this pack only as a secondary stress audit. It perturbs wording and evidence surface while keeping text/protocol pairs and expected answer contracts explicit. Do not merge it into contest_honest_headline_v1.
  claim_lanes: [state_transfer]
  single_variable: true
  variable_axes: [corpus_evidence_surface]
  public_surface: audit_only
  plan_source_default: yaml
  evidence_tier: audit_only
  benchmark_version: v3

tasks:
  - task_id: stress-auth-ambiguous-text-001
    task_group: route_corpus_stress_auth
    task_order: 1
    task_theme: contest_release_auth_rotation
    benchmark_lane: state_transfer
    allowed_modes: [text]
    corpus_path: contest_release_regression_corpus.yaml
    goal: Resolve an auth callback regression when the visible wording avoids route labels and includes a competing throttle hypothesis.
    query: callback failures persist after metadata rotation; one edge slice shows mild throttling, but issuer mismatch and stale metadata remain concentrated on tenants carrying old sessions
    corpus_doc_ids: [rr-auth-rate-limit-false, rr-auth-logs, rr-auth-metrics, rr-auth-ambiguous, rr-auth-rotation]
    evidence_text: Audit-only stress row with route-aligned wording partially hidden and a same-family competing throttle document moved earlier in the evidence set.
    tags: [release, auth, callback, throttle, rotation, stress]
    reuse_tags: [release, auth, session]
    expected_reuse_mode: none
    runtime_reuse_contract: reuse_disabled
    summary_hint: 'Return four concise points only: best-supported cause, strongest competing route, safest next action, and validation check.'
    transfer_strategy: text_strict_pure_lane
    handoff_profile: text_strict_pure_lane
    complexity_bucket: ambiguous
    summary_contract: actions_plus_evidence
    case_id: stress-auth-ambiguous
    case_type: abstention_allowed
    eval_scope: case_level
    expected_family: auth_session_drift
    primary_expected_route: auth_session_drift
    primary_expected_tool: tool.auth_session_repair
    acceptable_routes: [auth_session_drift, auth_rate_limit]
    acceptable_tools: [tool.auth_session_repair, tool.auth_jwks_refresh, tool.auth_rate_limit_triage, tool.collect_more_evidence]
    disallowed_families: []
    abstention_allowed: true
    allowed_abstain_tool: tool.collect_more_evidence
    abstain_only_when: mixed evidence keeps drift and throttle routes both admissible
    thickness_setting: S1
    reasoning_hops_min: 3
    dependency_depth: 1
    expected_intermediate_decisions:
      - keep drift and throttle route hypotheses explicit after retrieval
      - validate whether issuer mismatch plus stale metadata closes the throttle alternative
      - choose scoped session repair or collect more evidence if validation remains open
    abstention_boundary: Collect more evidence is score-valid only while validation keeps both drift and throttle routes admissible.
    required_plan_semantic_roles: [retrieve, validate, execute, summarize]

