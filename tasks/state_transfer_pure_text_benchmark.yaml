    query: inventory counts stay stale after a batch sync and mismatch across views
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-followup, cache-replica-false]
    evidence_text: Use only the referenced corpus docs; ignore memory reuse and compare pure-text versus typed-state executor handoff only.
