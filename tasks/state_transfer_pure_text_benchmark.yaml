task_set:
  name: state_transfer_pure_text_pack
  pack_type: state_transfer_pure_text
  description: Contest-oriented protocol-only formal pure-text fairness pack with 5 families x 4 paired cases.
  reading_contract: Read this pack as the formal pure-text-versus-typed-state fairness pack only; it keeps protocol mode and memory-off fixed, uses 5 families x 4 paired cases, and compares natural free-text handoff against typed state_ref handoff under the same controlled tasks.
  claim_lanes: [state_transfer]

tasks:
