    transfer_strategy: inline_text_handoff
    allowed_modes: [protocol]
    goal: Use the cited cache docs to triage the incident and recommend the first action.
    query: inventory counts stay stale after a batch sync and mismatch across views
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-followup, cache-replica-false]
    evidence_text: Use only the referenced corpus docs; ignore memory reuse and compare strict inline pure-text support evidence only.
    tags: [cache, inventory, sync-window, transfer, inline-text]
