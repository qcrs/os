task_set:
  name: planner_support_v3_pack
  pack_type: planner_support_v3
  description: V3 formal-secondary planner-support pack that compares yaml and llm
    planning under matched protocol state_packet_minimal rows.
  reading_contract: Read this pack only as the v3 planner-support surface. Planner
    openness is a separate protocol-only claim from communication medium and typed-state
    authenticity.
  claim_lanes:
  - communication
  single_variable: true
  variable_axes:
  - plan_source
  public_surface: formal_secondary_planner_support
  evidence_tier: formal_secondary
  benchmark_version: v3
tasks:
- task_id: planner-support-checkout-yaml-001
  task_group: planner_support_v3_lane
  task_order: 1
  task_theme: contest_release_checkout_regression
  plan_source: yaml
  benchmark_lane: internal_regression
  transfer_strategy: state_packet_minimal
  runtime_reuse_contract: reuse_disabled
  allowed_modes:
  - protocol
  corpus_path: contest_release_regression_corpus.yaml
  goal: Use the same runtime path to diagnose the checkout canary regression with
    a fixed yaml plan control row.
  query: checkout release 17.4 canary shows connection pool waits and slow orders
    query after rollout
  corpus_doc_ids:
  - rr-checkout-incident
  - rr-checkout-metrics
  - rr-checkout-logs
  - rr-checkout-worker-false
  evidence_text: This support task compares fixed yaml control against Planner LLM
    plan compilation; ignore memory reuse and keep the runtime path otherwise unchanged.
  tags:
  - release
  - checkout
  - latency
  - database
  - planner-support
  reuse_tags:
  - release
  - checkout
  - database
  expected_reuse_mode: none
  expected_route: db_pool_saturation
  expected_tool_name: tool.db_pool_triage
  expected_top_doc_id: rr-checkout-incident
  summary_hint: Return root cause, strongest competing explanation ruled out, first
    action, and validation check.
  case_id: planner-support-checkout-yaml-001
  case_type: exact_single_solution
  eval_scope: case_level
  expected_family: db_pool_saturation
  primary_expected_route: db_pool_saturation
  primary_expected_tool: tool.db_pool_triage
  acceptable_routes:
  - db_pool_saturation
  acceptable_tools:
  - tool.db_pool_triage
  disallowed_families: []
  abstention_allowed: false
  allowed_abstain_tool: ''
  abstain_only_when: ''
  handoff_profile: protocol_minimal_state_packet
  summary_contract: actions_plus_evidence
