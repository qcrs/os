task_set:
  name: audit_handoff_carrier_truth_pack
  pack_type: audit_handoff_carrier_truth
  description: Audit-only pack that separates inline text, statepool-backed natural text, minimal text packet, and minimal typed packet under one fixed case family.
  reading_contract: Read this pack only as audit evidence for carrier truth. It isolates handoff form differences and should not replace the current v3 formal surface.
  claim_lanes:
  - state_transfer
  evidence_tier: audit_only
  benchmark_version: v3
