  task_order: 1
  task_theme: contest_release_checkout_regression
  benchmark_lane: state_transfer
  allowed_modes: [text]
  corpus_path: contest_release_regression_corpus.yaml
  goal: Use the cited release artifacts to triage the checkout regression and recommend
    the first action.
  query: checkout canary order confirmations slowed after the rollout, and operators
    need the safest first validation action
  corpus_doc_ids: &checkout_clean_docs [rr-checkout-incident, rr-checkout-metrics, rr-checkout-logs, rr-checkout-worker-false]
  evidence_text: Use only the referenced release artifacts. This row is the strict pure-text formal baseline.
  tags: &checkout_clean_tags [release, checkout, latency, clean]
  reuse_tags: &checkout_reuse_tags [release, checkout, latency]
  expected_reuse_mode: none
  runtime_reuse_contract: reuse_disabled
  summary_hint: 'Return four concise points only: most likely cause, strongest competing
    explanation ruled out, first action, and first validation check.'
  task_id: rr-checkout-clean-text-001
  transfer_strategy: text_strict_pure_lane
  case_id: rr-checkout-clean
  case_type: bounded_alternative
  eval_scope: case_level
