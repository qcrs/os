  description: V3 formal dual-mode controlled pack with matched strict pure-text
    and minimal typed-state protocol rows on the same 20 contest-release cases.
  reading_contract: Read this pack only as the formal v3 dual-mode controlled pack.
    Each pair keeps the same family, query, evidence universe, summary contract, and
    plan source fixed; mode and handoff object differ together, so this is a controlled
    composite comparison rather than a single-variable external pure-text baseline.
