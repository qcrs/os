tasks:
  - task_id: diag-retrieval-out-of-hint-001
    task_group: retrieval_replay_diag
    task_order: 1
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: reuse_disabled
    goal: Verify that retrieval can surface a stronger out-of-hint replica-lag document.
    query: reporting replica lag after failover caused stale reads
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-followup]
    evidence_text: This is a retrieval diagnostic task; confirm stronger out-of-hint evidence can win.
    tags: [cache, inventory, replica]
    reuse_tags: [cache, inventory, replica]
    expected_reuse_mode: none
    expected_route: cache_replica_stale_read
    expected_tool_name: tool.replica_stale_read_triage
    expected_top_doc_id: cache-replica-false
    summary_hint: >
      This retrieval diagnostic should surface the replica-lag route rather than the
      invalidation playbook, because the stronger fresh evidence points outside the
      hinted doc set.

  - task_id: diag-replay-no-doc-pref-001
    task_group: retrieval_replay_diag
    task_order: 2
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: assist_allowed
    goal: Build the cache-chain replay prefix without relying on benchmark-provided doc preferences.
    query: replay stale inventory aggregate invalidation after sync burst
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-replay]
    evidence_text: This is a replay diagnostic prefix task; it should still fetch fresh evidence.
    tags: [cache, inventory, invalidation, replay]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: assist
    expected_route: cache_invalidation
    summary_hint: >
      This prefix task should keep the invalidation route warm through normal fresh
      retrieval, without turning the current task doc preference into a replay requirement.

  - task_id: diag-replay-validated-001
    task_group: retrieval_replay_diag
    task_order: 3
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: validated_replay
    goal: Build the validated replay anchor needed for later exact replay.
    query: validated replay stale inventory aggregate invalidation after sync burst
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-replay]
    evidence_text: This is a replay diagnostic anchor task; validated replay must still confirm the route from fresh retrieval.
    tags: [cache, inventory, invalidation, validated-replay]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: skip_execute
    expected_route: cache_invalidation
    summary_hint: >
      This validated replay diagnostic should confirm the same invalidation route
      from fresh evidence, then prune execute.

  - task_id: diag-replay-no-doc-pref-002
    task_group: retrieval_replay_diag
    task_order: 5
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: exact_replay
    goal: Verify that exact replay no longer depends on current-task corpus doc preferences.
    query: validated replay stale inventory aggregate invalidation after sync burst
    corpus_doc_ids: []
    evidence_text: This is a replay diagnostic task; exact replay should match runtime evidence without current doc preferences.
    tags: [cache, inventory, invalidation, exact-replay]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: skip_retrieve_execute
    expected_route: cache_invalidation
    summary_hint: >
      This exact replay diagnostic should skip retrieve and execute from runtime-matched
      replay evidence, even though the current task does not provide corpus doc preferences.

  - task_id: diag-replay-validated-docset-drift-001
    task_group: retrieval_replay_diag
    task_order: 4
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: validated_replay
    goal: Verify that validated replay still refuses to skip execute when the current query stays close but fresh retrieval lands on a different same-route doc set.
    query: validated replay stale inventory aggregate invalidation after sync burst stale inventory
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-followup]
    evidence_text: This is a replay diagnostic doc-set drift task; validated replay should keep execute live when fresh retrieval evidence drifts to a different same-route doc set.
    tags: [cache, inventory, invalidation, validated-replay]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: none
    expected_route: cache_invalidation
    summary_hint: >
      This validated replay diagnostic should refuse execute pruning because the
      fresh retrieval still confirms cache invalidation but lands on a different
      evidence/doc-set slice from the archived replay anchor.

  - task_id: diag-replay-query-drift-001
    task_group: retrieval_replay_diag
    task_order: 7
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: exact_replay
    goal: Verify that exact replay still refuses to skip when the current query drifts away from the archived replay query.
    query: validated replay stale inventory after failover replica lag
    corpus_doc_ids: []
    evidence_text: This is a replay diagnostic negative control; query drift should block exact replay.
    tags: [cache, inventory, exact-replay, failover]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: none
    summary_hint: >
      This replay diagnostic should refuse exact replay because the current query
      drifts toward replica-lag language instead of matching the archived invalidation replay query.

  - task_id: diag-replay-tag-drift-001
    task_group: retrieval_replay_diag
    task_order: 6
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: exact_replay
    goal: Verify that exact replay no longer depends on the current task's tags or reuse signature when query and theme still align.
    query: validated replay stale inventory aggregate invalidation after sync burst
    corpus_doc_ids: []
    evidence_text: This is a replay diagnostic contract drift task; exact replay should still work even when current tags and reuse signature drift.
    tags: [cache, inventory, contract-drift, replay-drift]
    reuse_tags: [cache, contract-drift, replay-drift]
    expected_reuse_mode: skip_retrieve_execute
    expected_route: cache_invalidation
    summary_hint: >
      This exact replay diagnostic should still skip retrieve and execute even though
      the current task tags and reuse signature drift away from the archived invalidation task.

  - task_id: diag-replay-theme-drift-001
    task_group: retrieval_replay_diag
    task_order: 8
    task_theme: repo_local_cache_staleness_variant
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: exact_replay
    goal: Verify that exact replay remains task-theme scoped even when the current query still matches the archived invalidation replay query.
    query: validated replay stale inventory aggregate invalidation after sync burst
    corpus_doc_ids: []
    evidence_text: This is a replay diagnostic theme drift task; theme mismatch should block exact replay even when the query still matches.
    tags: [cache, inventory, invalidation, theme-drift]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: none
    summary_hint: >
      This replay diagnostic should refuse exact replay because the current task
      theme drifts away from the archived invalidation chain, even though the query still matches.
