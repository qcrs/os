    query: service-c orders latency connection pool contention slow query
    corpus_doc_ids: [latency-db-anchor, latency-db-followup, latency-worker-false, latency-db-replay]
    evidence_text: Use the referenced corpus docs only; memory may suggest a playbook but cannot skip retrieval.
    tags: [latency, database, service-c, followup]
    reuse_tags: [latency, database, orders]
    expected_reuse_mode: assist
