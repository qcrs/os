task_set:
  name: internal_regression_pack
  pack_type: internal_regression
  description: Host-mainline internal regression pack for incident chains, lexical-override route diagnostics, and conservative replay engineering coverage.
  reading_contract: Read this pack as engineering regression coverage only; use it to verify runtime behavior and route-diagnostic boundaries, not as a formal contest headline pack.
  claim_lanes: []

tasks:
  - task_id: sample-cache-001
    task_group: cache_chain
    task_order: 1
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    goal: Diagnose the first stale inventory report from corpus-backed local evidence.
    query: inventory stale counts batch sync aggregate invalidation
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-followup, cache-replica-false, cache-invalid-replay]
    evidence_text: Use the referenced corpus docs only; treat any prior memory as a hypothesis.
    tags: [cache, inventory, invalidation, anchor]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: none
    runtime_reuse_contract: assist_allowed
    summary_hint: >
      Fresh evidence should identify delayed aggregate invalidation after batch sync
      and recommend forcing the post-sync invalidation hook.

  - task_id: sample-cache-002
    task_group: cache_chain
    task_order: 2
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    goal: Use the current task evidence and prior memory to speed up a follow-up stale inventory triage.
    query: follow-up inventory stale counts shared aggregate invalidation hook
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-followup, cache-replica-false, cache-invalid-replay]
    evidence_text: Use the referenced corpus docs only; validate any recalled playbook against fresh evidence.
    tags: [cache, inventory, invalidation, followup]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: assist
    runtime_reuse_contract: assist_allowed
    summary_hint: >
      This follow-up should validate the earlier invalidation playbook against fresh
      corpus evidence before recommending the same fix.

  - task_id: sample-cache-003
    task_group: cache_chain
    task_order: 3
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    goal: Distinguish a misleading stale inventory alert from the known invalidation playbook.
    query: stale inventory after failover replica lag looks like invalidation issue
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-followup, cache-replica-false, cache-invalid-replay]
    evidence_text: Use the referenced corpus docs only; reject reused memory if fresh evidence points elsewhere.
    tags: [cache, inventory, sync-window, failover]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: none
    runtime_reuse_contract: assist_allowed
    summary_hint: >
      Fresh evidence should reject the invalidation shortcut and instead isolate the
      stale-read path on the reporting replica.

  - task_id: sample-cache-004
    task_group: cache_chain
    task_order: 4
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    goal: Verify the invalidation path again on a control replay without skipping fresh retrieval.
    query: replay stale inventory aggregate invalidation after sync burst
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-replay]
    evidence_text: Use the referenced corpus docs only; replay should still fetch fresh evidence.
    tags: [cache, inventory, invalidation, replay]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: assist
    runtime_reuse_contract: assist_allowed
    summary_hint: >
      The control replay should validate the same invalidation playbook against fresh
      corpus evidence and keep the reuse path conservative.

  - task_id: sample-cache-005
    task_group: cache_chain
    task_order: 5
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    goal: Run a validated replay that still performs fresh retrieval before pruning execute.
    query: validated replay stale inventory aggregate invalidation after sync burst
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-replay]
    evidence_text: Use the referenced corpus docs only; validated replay must still confirm the route from fresh retrieval.
    tags: [cache, inventory, invalidation, validated-replay]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: skip_execute
    runtime_reuse_contract: validated_replay
    summary_hint: >
      This validated replay should confirm the same invalidation route from fresh
      evidence, then safely prune execute by reusing the prior tool artifact.

  - task_id: sample-cache-006
    task_group: cache_chain
    task_order: 6
    task_theme: repo_local_cache_staleness
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    goal: Run an exact replay that skips retrieve and execute from runtime-matched replay evidence.
    query: validated replay stale inventory aggregate invalidation after sync burst
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-replay]
    evidence_text: Use the stored replay evidence plus current task inputs only; exact replay may skip retrieve and execute when the validated replay route matches exactly.
    tags: [cache, inventory, invalidation, exact-replay]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: skip_retrieve_execute
    runtime_reuse_contract: exact_replay
    summary_hint: >
      This exact replay should reuse the prior validated replay end to end and still
      summarize a fresh memory commit for the current task.

