docs:
  - doc_id: cache-invalid-anchor
    task_group: cache_chain
    task_theme: repo_local_cache_staleness
    title: Inventory aggregate invalidation lag after batch sync
    tags: [cache, inventory, invalidation, sync-window]
    text: >
      Sample incident cache-A: inventory pages showed stale counts after a batch
      sync. The repo-local trace points to delayed cache invalidation on the
      inventory aggregate key. The known remediation is to force the aggregate
      invalidation hook immediately after the sync job.

  - doc_id: cache-invalid-followup
    task_group: cache_chain
    task_theme: repo_local_cache_staleness
    title: Repeat stale inventory caused by the same invalidation hook
    tags: [cache, inventory, invalidation, aggregate-key]
    text: >
      Sample incident cache-B: another stale inventory alert followed the same
      sync window pattern. The strongest evidence again points to delayed
      invalidation on the shared inventory aggregate key rather than a storage
      layer failure.

  - doc_id: cache-replica-false
    task_group: cache_chain
    task_theme: repo_local_cache_staleness
    title: Replica lag made inventory look stale without an invalidation bug
    tags: [cache, inventory, replica, stale-read]
    text: >
      Sample incident cache-C: stale inventory counts came from a reporting read
      replica that lagged behind the writer after a failover. The invalidation
      hook fired on time; the actual problem was stale reads on the replica path.

  - doc_id: cache-invalid-replay
    task_group: cache_chain
    task_theme: repo_local_cache_staleness
    title: Control replay of the invalidation path during another sync burst
    tags: [cache, inventory, invalidation, replay]
    text: >
      Sample incident cache-D: a later sync burst reproduced the same inventory
      aggregate invalidation gap. The trace again showed the post-sync
      invalidation hook missing the aggregate refresh window.

  - doc_id: latency-db-anchor
    task_group: latency_chain
    task_theme: repo_local_latency_triage
    title: Orders API slowed down because release-17 saturated the DB pool
    tags: [latency, database, release-17, orders]
    text: >
      Sample incident lat-A: orders API p95 climbed after release-17. The
      repo-local evidence points to DB pool saturation and a slow orders query.
      The known playbook is to rollback release-17, add the missing
      orders_created_at index, and verify pool sizing.

  - doc_id: latency-db-followup
    task_group: latency_chain
    task_theme: repo_local_latency_triage
    title: Service-c hit the same orders-query saturation pattern
    tags: [latency, database, service-c, orders]
    text: >
      Sample incident lat-B: service-c hit the same burst-window latency pattern.
      The trace again showed connection pool contention and the slow orders
      query family rather than CPU saturation inside the workers.

  - doc_id: latency-worker-false
    task_group: latency_chain
    task_theme: repo_local_latency_triage
    title: Release-window latency actually came from worker queue starvation
    tags: [latency, release-17, worker, tls]
    text: >
      Sample incident lat-C: a release-window latency spike looked similar at
      first, but the fresh evidence points to TLS certificate reload stalls and
      worker queue starvation. The database pool stayed healthy throughout.

  - doc_id: latency-db-replay
    task_group: latency_chain
    task_theme: repo_local_latency_triage
    title: Control replay of the orders-query saturation path
    tags: [latency, database, replay, orders]
    text: >
      Sample incident lat-D: another control replay reproduced the orders query
      slowdown with the same DB wait profile and release-era saturation
      symptoms. The evidence still favors the known database playbook.

  - doc_id: session-auth-anchor
    task_group: session_chain
    task_theme: repo_local_auth_session_drift
    title: SSO callback failures caused by issuer drift and stale JWKS
    tags: [auth, session, sso, jwks]
    text: >
      Sample incident sess-A: users were bounced out of the SSO callback after
      an issuer mismatch. The repo-local note points to stale JWKS cache and
      stale session cookies after cert rotation. The remediation is to refresh
      JWKS, clear stale session cookies, and re-run callback verification.

  - doc_id: session-auth-followup
    task_group: session_chain
    task_theme: repo_local_auth_session_drift
    title: Follow-up session failures matched the same issuer-drift path
    tags: [auth, session, sso, callback]
    text: >
      Sample incident sess-B: a second SSO callback failure again matched stale
      session cookies plus outdated JWKS metadata after a rotation. The fresh
      trace still points to session drift rather than a rate limiter.

  - doc_id: session-rate-limit-false
    task_group: session_chain
    task_theme: repo_local_auth_session_drift
    title: Login failures came from rate limiting, not session drift
    tags: [auth, session, sso, rate-limit]
    text: >
      Sample incident sess-C: login attempts failed during an aggressive
      backoff window. Session tokens and JWKS verification stayed healthy; the
      actual cause was an overly strict auth rate limiter.

  - doc_id: session-auth-replay
    task_group: session_chain
    task_theme: repo_local_auth_session_drift
    title: Control replay of the stale-JWKS session failure
    tags: [auth, session, replay, jwks]
    text: >
      Sample incident sess-D: another callback replay reproduced the stale JWKS
      and issuer mismatch path. The known remediation remains JWKS refresh,
      session-cookie cleanup, and callback verification.
