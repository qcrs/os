  - task_id: sample-cache-005
    task_group: cache_chain
    task_order: 5
    task_theme: repo_local_cache_staleness
    goal: Replay the follow-up cache incident to verify pruning consistency.
    query: replay follow-up inventory stale counts invalidation lag
    evidence_text: >
      Sample incident J: replay the follow-up stale inventory case where delayed
      invalidation on the aggregate key remains the strongest clue.
    tags:
      - cache
      - invalidation
      - replay-followup
    reuse_tags:
      - cache
      - invalidation
    expected_reuse: true
    summary_hint: >
      Replay of the follow-up cache incident should prune retrieval and execute
