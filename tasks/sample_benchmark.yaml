    query: inventory stale counts batch sync aggregate invalidation
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-followup, cache-replica-false, cache-invalid-replay]
    evidence_text: Use the referenced corpus docs only; treat any prior memory as a hypothesis.
    tags: [cache, inventory, invalidation, anchor]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: none
    summary_hint: >
      Fresh evidence should identify delayed aggregate invalidation after batch sync
      and recommend forcing the post-sync invalidation hook.

