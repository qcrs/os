    tags: [latency, database, release-17, anchor]
    reuse_tags: [latency, database, orders]
    expected_reuse_mode: none
    runtime_reuse_contract: assist_allowed
    summary_hint: >
      Fresh evidence should point to DB pool saturation and the slow orders query,
      then recommend rollback plus index creation.

