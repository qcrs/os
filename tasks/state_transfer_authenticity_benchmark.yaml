    task_group: transfer_lane
    task_order: 1
    task_theme: repo_local_cache_staleness
    benchmark_lane: state_transfer
    transfer_strategy: text_brief
    allowed_modes: [protocol]
    goal: Use the cited cache docs to triage the incident and recommend the first action.
    query: inventory counts stay stale after a batch sync and mismatch across views
    corpus_doc_ids: [cache-invalid-anchor, cache-invalid-followup, cache-replica-false]
    evidence_text: Use only the referenced corpus docs; ignore memory reuse and compare executor handoff representation only.
    tags: [cache, inventory, sync-window, transfer]
    reuse_tags: [cache, inventory, invalidation]
    expected_reuse_mode: none
    runtime_reuse_contract: reuse_disabled
    summary_hint: >
      Return three concise points only: the most likely cause, the competing
      explanation ruled out by the cited docs, and the first action.

