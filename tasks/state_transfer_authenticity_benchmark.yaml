task_set:
  name: state_transfer_authenticity_pack
  pack_type: state_transfer_authenticity
  description: Controlled protocol-only typed-handoff authenticity pack for text-brief versus state-ref executor handoff comparisons.
  reading_contract: Read this pack as the formal typed-handoff authenticity pack only; it tests whether non-text handoff preserves the same executor route and tool choice as the text-shadow baseline.
  claim_lanes: [state_transfer]

tasks:
