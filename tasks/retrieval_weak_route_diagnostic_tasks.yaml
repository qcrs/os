tasks:
  - task_id: diag-retrieval-weak-route-cache-invalidation-001
    task_group: session_chain
    task_order: 1
    task_theme: repo_local_auth_session_drift
    benchmark_lane: internal_regression
    transfer_strategy: state_ref
    runtime_reuse_contract: reuse_disabled
    goal: Verify that a weak cache-family query still leans toward the invalidation route when the preferred in-family doc points there.
    query: inventory stale counts
    corpus_doc_ids: [session-auth-anchor, latency-db-anchor, cache-invalid-anchor]
    evidence_text: This retrieval diagnostic uses wrong-family task context and a thin cache-family query; the remaining route decision should lean toward the preferred invalidation doc.
    tags: [cache, inventory]
    reuse_tags: [cache, inventory]
    expected_reuse_mode: none
    summary_hint: >
      This retrieval diagnostic should keep the invalidation route on top
      because the weak cache-family query leaves room for the preferred
      in-family invalidation doc to dominate.

