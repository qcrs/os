    query: inventory stale counts
    corpus_doc_ids: [session-auth-anchor, latency-db-anchor, cache-replica-false]
    evidence_text: This retrieval diagnostic keeps the same wrong-family task context and thin cache-family query, but switches the in-family preferred doc to the replica path.
    tags: [cache, inventory]
    reuse_tags: [cache, inventory]
    expected_reuse_mode: none
    summary_hint: >
      This retrieval diagnostic should flip to the replica route because the
      weak cache-family query leaves route choice sensitive to the preferred
      in-family doc.

