    issue appears without replica lag.
- doc_id: rr-cache-incident
  task_group: inventory_rollout_chain
  task_theme: contest_release_inventory_rollout
  title: Inventory counts stayed stale after a rollout-region sync window
  tags:
  - release
  - inventory
  - incident
  - cache
  - sync-window
  eval_route_label: cache_invalidation
  eval_tool_label: tool.cache_invalidation_playbook
  text: After the new sync path reached one rollout region, inventory counts on the
    read side stayed stale after batch sync. The incident note says aggregate-refresh
    updates are missing on the new sync path while writes stay healthy, with cache
    invalidation loss, aggregate invalidation misses, and invalidation hook skips
    appearing together, but does not yet fully close whether the primary cause is
    invalidation loss or stale replica reads.
