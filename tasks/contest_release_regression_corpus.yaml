- doc_id: rr-checkout-reuse
  task_group: checkout_release_chain
  task_theme: contest_release_checkout_regression
  title: Follow-up note requires carrying forward the rejected worker hypothesis
  tags:
  - release
  - checkout
  - reusable
  - scope
  - validation
  eval_route_label: db_pool_saturation
  eval_tool_label: tool.db_query_hotfix
  text: The reusable follow-up note says the scoped action is safe only if the prior
    case already ruled out the reload-driven worker backlog. If that rejection is
    not inherited, the safe control remains to collect more evidence before changing
    the confirmation-path rollout.
- doc_id: rr-checkout-scope
  task_group: checkout_release_chain
  task_theme: contest_release_checkout_regression
  title: Scope note limits the regression to the release canary shard
  tags:
