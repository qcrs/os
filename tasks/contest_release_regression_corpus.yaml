corpus_metadata:
  formal_structure_clean: true
docs:
- doc_id: rr-auth-ambiguous
  task_group: auth_rotation_chain
  task_theme: contest_release_auth_rotation
  title: Ambiguity note keeps rate-limit triage admissible until drift is confirmed
  tags:
  - release
  - auth
  - ambiguous
  - rate-limit
  - session
  eval_route_label: auth_session_drift
  eval_tool_label: tool.auth_session_repair
  text: A later note records a mild throttle rise on one edge slice. It says the session-drift
    route stays primary, but rate-limit triage remains admissible until the callback
    drift evidence is carried forward.
- doc_id: rr-auth-incident
  task_group: auth_rotation_chain
  task_theme: contest_release_auth_rotation
  title: Callback failures rose after auth metadata rotation
  tags:
  - release
  - auth
  - incident
  - callback
  - session
  eval_route_label: auth_session_drift
  eval_tool_label: tool.auth_session_repair
  text: After the metadata rotation, callback failures and forced sign-outs rose on
    the auth canary. The incident note says the failures cluster in one slice of traffic,
    with callback verification failures, stale jwks cache hits, issuer mismatch symptoms,
    and session drift appearing together, but does not fully close whether the main
    issue is session drift or a throttling control.
- doc_id: rr-auth-logs
  task_group: auth_rotation_chain
  task_theme: contest_release_auth_rotation
  title: Logs show issuer mismatch while callback retries stay local
  tags:
  - release
  - auth
  - logs
  - session
  - jwks
  eval_route_label: auth_session_drift
  eval_tool_label: tool.auth_session_repair
  text: The logs show issuer mismatch lines and stale metadata refresh lag on the
    callback path. They do not show a service-wide throttle spiral.
- doc_id: rr-auth-metrics
  task_group: auth_rotation_chain
  task_theme: contest_release_auth_rotation
  title: Metrics show callback verification drift without broad throttle pressure
  tags:
  - release
  - auth
  - metrics
  - session
  - jwks
  eval_route_label: auth_session_drift
  eval_tool_label: tool.auth_session_repair
  text: The dashboard shows callback verification failures and stale metadata cache
    hits climbing together. Broad throttle counters stay near baseline during the
    same window.
- doc_id: rr-auth-rate-limit-false
  task_group: auth_rotation_chain
  task_theme: contest_release_auth_rotation
  title: Earlier login failures were caused by an aggressive throttle window
  tags:
  - release
  - auth
  - distractor
  - rate-limit
  - queue
  eval_route_label: auth_rate_limit
  eval_tool_label: tool.auth_rate_limit_triage
  text: A previous auth incident came from a bad throttle window and aggressive backoff.
    That case did not show stale metadata drift or issuer mismatch on the callback
    path, stale jwks refresh loss, or session drift on callback verification.
- doc_id: rr-auth-reuse
  task_group: auth_rotation_chain
  task_theme: contest_release_auth_rotation
  title: Follow-up note requires inherited rejection of pure throttle regression
  tags:
  - release
  - auth
  - reusable
  - scope
  - validation
  eval_route_label: auth_session_drift
  eval_tool_label: tool.auth_jwks_refresh
  text: The reusable follow-up says the scoped JWKS refresh is safe only if the prior
    case already rejected a pure throttle regression. Without that carried-forward
    rejection, the safe action is to gather more evidence.
- doc_id: rr-auth-rotation
  task_group: auth_rotation_chain
  task_theme: contest_release_auth_rotation
  title: Rotation runbook distinguishes stale-session repair from rate-limit triage
  tags:
  - release
  - auth
  - runbook
  - structural-anchor
  - jwks
  eval_route_label: auth_session_drift
  eval_tool_label: tool.auth_jwks_refresh
  text: The post-rotation runbook says to refresh JWKS and clear stale session cookies
    when callback verification drifts after metadata rotation. It says to use rate-limit
    triage only when throttle counters drive the loss.
- doc_id: rr-auth-scope
  task_group: auth_rotation_chain
  task_theme: contest_release_auth_rotation
  title: Scope note limits failures to tenants with cached pre-rotation sessions
  tags:
  - release
  - auth
  - scope
  - session
  - canary
  eval_route_label: auth_session_drift
  eval_tool_label: tool.auth_session_repair
  text: The scope note limits failures to tenants carrying pre-rotation sessions into
    the canary. The same scope note says the affected slice lines up with stale pre-rotation
    sessions rather than a broad throttle spiral, so any first action should stay
    inside that tenant slice until the throttle hypothesis is rejected.
- doc_id: rr-billing-ambiguous
  task_group: billing_queue_chain
  task_theme: contest_release_billing_queue_backlog
  title: Ambiguity note keeps database triage admissible until retry cause is carried
    forward
  tags:
  - release
  - billing
  - ambiguous
  - database
  - worker
  eval_route_label: worker_queue_starvation
  eval_tool_label: tool.worker_queue_triage
  text: A later review notes a modest wait-time rise on one shard. It says the worker
    path stays primary, but database triage remains admissible until the retry-driven
    explanation is explicitly preserved.
- doc_id: rr-billing-db-false
  task_group: billing_queue_chain
  task_theme: contest_release_billing_queue_backlog
  title: Earlier invoice delay was caused by a database pool collapse
  tags:
  - release
  - billing
  - distractor
  - database
  - queue
  eval_route_label: db_pool_saturation
  eval_tool_label: tool.db_pool_triage
  text: A previous invoice delay case came from a pool collapse and wait-time growth
    in the billing database path. That case did not show retry storms or worker backlog
    as the dominant signal.
- doc_id: rr-billing-incident
  task_group: billing_queue_chain
  task_theme: contest_release_billing_queue_backlog
  title: Invoice backlog rose on the canary after a worker reload
  tags:
  - release
  - billing
  - incident
  - queue
  - worker
  eval_route_label: worker_queue_starvation
  eval_tool_label: tool.worker_queue_triage
  text: After a billing canary reload, invoice completion delay rose quickly and requests
    waited longer in the processing path. The incident note records retry storm behavior,
    invoice queue backlog growth, and worker queue starvation on one slice, but does
    not yet fully close whether the main route is worker backlog or a database contention
    relapse.
- doc_id: rr-billing-logs
  task_group: billing_queue_chain
  task_theme: contest_release_billing_queue_backlog
  title: Logs record repeated retry rescheduling on the worker slice
  tags:
  - release
  - billing
  - logs
  - queue
  - worker
  eval_route_label: worker_queue_starvation
  eval_tool_label: tool.worker_queue_triage
  text: Worker logs record repeated retry rescheduling and backlog warnings on the
    canary slice. They do not show the same dominant wait pattern seen in the old
    database-collapse incident.
- doc_id: rr-billing-metrics
  task_group: billing_queue_chain
  task_theme: contest_release_billing_queue_backlog
  title: Metrics show retry growth and queue expansion without broad pool collapse
  tags:
  - release
  - billing
  - metrics
  - queue
  - worker
  eval_route_label: worker_queue_starvation
  eval_tool_label: tool.worker_queue_triage
  text: The metrics snapshot shows queue depth growth and retry expansion through
    the reload window. Database wait stays close to baseline.
- doc_id: rr-billing-reuse
  task_group: billing_queue_chain
  task_theme: contest_release_billing_queue_backlog
  title: Follow-up note requires inherited rejection of the database-collapse route
  tags:
  - release
  - billing
  - reusable
  - scope
  - validation
  eval_route_label: worker_queue_starvation
  eval_tool_label: tool.retry_storm_relief
  text: The reusable follow-up says draining retries is safe only if the prior case
    already rejected the database-collapse route. Without that inherited rejection,
    the safe control is to collect more evidence first.
- doc_id: rr-billing-runbook
  task_group: billing_queue_chain
  task_theme: contest_release_billing_queue_backlog
  title: Runbook says to drain retries before widening rollback
  tags:
  - release
  - billing
  - runbook
  - structural-anchor
  - worker
  eval_route_label: worker_queue_starvation
  eval_tool_label: tool.retry_storm_relief
  text: The billing runbook says to pause the retry trigger, drain the affected slice,
    and rebalance workers before widening rollback. It distinguishes this route from
    pool-collapse incidents.
- doc_id: rr-billing-scope
  task_group: billing_queue_chain
  task_theme: contest_release_billing_queue_backlog
  title: Scope note keeps the backlog limited to the canary worker slice
  tags:
  - release
  - billing
  - scope
  - queue
  - worker
  eval_route_label: worker_queue_starvation
  eval_tool_label: tool.worker_queue_triage
  text: The scope note keeps the backlog limited to one canary worker slice. Any first
    action should stay there until the database-collapse explanation is rejected.
    The same note says the blast radius never widened into a broad database collapse,
    which keeps the worker queue starvation branch live instead of a broad database
    collapse.
- doc_id: rr-checkout-ambiguous
  task_group: checkout_release_chain
  task_theme: contest_release_checkout_regression
  title: Ambiguity note keeps a worker route admissible until one signal clears
  tags:
