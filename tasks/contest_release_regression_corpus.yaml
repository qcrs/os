  - checkout
  - ambiguous
  - worker
  - database
  eval_route_label: db_pool_saturation
  eval_tool_label: tool.db_pool_triage
  text: A later review notes mild worker jitter on a subset of pods, but it does not
    overturn the confirmation-path wait profile. The note says to keep a worker route
    admissible until the contention source is fully isolated.
- doc_id: rr-checkout-config
  task_group: checkout_release_chain
  task_theme: contest_release_checkout_regression
  title: Rollout diff reduced connection headroom and changed confirmation filtering
  tags:
  - release
  - checkout
  - config
  - structural-anchor
  - database
  eval_route_label: db_pool_saturation
  eval_tool_label: tool.db_pool_triage
  text: The rollout diff lowered pool caps and added a new confirmation filter. The
    runbook says to revert both together if wait-time growth appears without matching
    worker backlog evidence.
- doc_id: rr-checkout-incident
  task_group: checkout_release_chain
  task_theme: contest_release_checkout_regression
  title: Checkout canary latency rose after release 17.4
  tags:
  - release
  - checkout
  - latency
  - incident
  - canary
  eval_route_label: db_pool_saturation
  eval_tool_label: tool.db_pool_triage
  text: Release 17.4 reached the checkout canary and order confirmation latency rose
    quickly on one shard. The incident note says requests stack up during the confirmation
    path after the rollout, with sql wait growth, connection pool headroom loss, and
    database pool contention around the changed filter path, while the blast radius
    is still limited to the canary tenants.
- doc_id: rr-checkout-logs
  task_group: checkout_release_chain
  task_theme: contest_release_checkout_regression
  title: Log excerpt records wait-time spikes around the confirmation path
  tags:
  - release
  - checkout
  - latency
  - logs
  - database
  eval_route_label: db_pool_saturation
  eval_tool_label: tool.db_pool_triage
  text: The checkout logs record repeated wait-time spikes around the confirmation
    path and repeated warnings that request threads are blocked before commit. The
    traces do not show a matching reload-storm pattern on workers.
- doc_id: rr-checkout-metrics
  task_group: checkout_release_chain
  task_theme: contest_release_checkout_regression
  title: Metrics show confirmation-path contention while queue depth stays near baseline
