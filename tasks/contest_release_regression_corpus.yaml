docs:
  - doc_id: rr-checkout-incident
    task_group: checkout_release_chain
    task_theme: contest_release_checkout_regression
    title: Checkout release introduced order latency and connection waits
    tags: [release, checkout, latency, database, canary]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      Release 17.4 shipped to the checkout service canary and the first alerts
      showed order confirmation p95 rising from the normal band to a degraded
      range. The incident report says most affected requests are stuck behind
      connection pool waits on the write path rather than failing at the edge.

  - doc_id: rr-checkout-metrics
    task_group: checkout_release_chain
    task_theme: contest_release_checkout_regression
    title: Metrics snapshot shows connection pool pressure and slow orders query
    tags: [release, checkout, latency, database, metrics]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      The metrics snapshot records repeated connection pool saturation, a rising
      sql wait band, and a slow orders query tied to the orders_created_at
      filter. CPU stayed below saturation and worker queue depth was near the
      usual baseline.

  - doc_id: rr-checkout-logs
    task_group: checkout_release_chain
    task_theme: contest_release_checkout_regression
    title: Log excerpt points to db wait profile after checkout canary rollout
    tags: [release, checkout, latency, database, logs]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      The checkout logs show db wait profile spikes within minutes of the canary
      rollout. Multiple traces include connection pool exhaustion warnings and a
      slow orders query path before order confirmation completes.

  - doc_id: rr-checkout-config
    task_group: checkout_release_chain
    task_theme: contest_release_checkout_regression
    title: Rollout diff reduced pool headroom while adding a new orders filter
    tags: [release, checkout, rollout, database, config]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      The rollout diff changed the checkout read/write pool caps and added a new
      orders_created_at query filter in the confirmation path. The runbook note
      says these two changes should be rolled back together if sql wait and
      connection pool contention appear at the same time.

  - doc_id: rr-checkout-worker-false
    task_group: checkout_release_chain
    task_theme: contest_release_checkout_regression
    title: Similar release incident previously came from worker queue starvation
    tags: [release, checkout, latency, worker, distractor]
    eval_route_label: worker_queue_starvation
    eval_tool_label: tool.worker_queue_triage
    text: >
      A different checkout incident during a certificate rotation looked similar
      at first, but the root cause there was worker queue starvation during a
      tls reload. That event had healthy database pool metrics and no slow
      orders query evidence.

  - doc_id: rr-checkout-scope
    task_group: checkout_release_chain
    task_theme: contest_release_checkout_regression
    title: Scope note narrows the blast radius to the release canary shard
    tags: [release, checkout, scope, canary, database]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      The later scope update shows the latency spike is concentrated in the new
      canary shard and in tenants that hit the changed confirmation path. The
      fastest safe validation is to rollback release 17.4 on that shard, create
      the missing index, and recheck pool pressure before widening action.

  - doc_id: rr-auth-incident
    task_group: auth_rotation_chain
    task_theme: contest_release_auth_rotation
    title: SSO callback regression appeared after auth metadata rotation
    tags: [release, auth, sso, session, callback]
    eval_route_label: auth_session_drift
    eval_tool_label: tool.auth_session_repair
    text: >
      After the auth metadata rotation, the incident report shows callback
      failures and repeated sign-outs for users who crossed the new canary.
      Operators noted issuer mismatch errors and stale session cookies rather
      than a hard outage at the identity provider.

  - doc_id: rr-auth-metrics
    task_group: auth_rotation_chain
    task_theme: contest_release_auth_rotation
    title: Metrics snapshot shows callback verification drift instead of edge throttling
    tags: [release, auth, session, jwks, metrics]
    eval_route_label: auth_session_drift
    eval_tool_label: tool.auth_session_repair
    text: >
      The auth dashboard shows callback verification failures rising alongside
      stale jwks cache hits. Rate-limit counters stayed close to baseline and
      there is no matching aggressive backoff window on the affected shard.

  - doc_id: rr-auth-logs
    task_group: auth_rotation_chain
    task_theme: contest_release_auth_rotation
    title: Log excerpt shows issuer mismatch and stale JWKS refresh lag
    tags: [release, auth, session, jwks, logs]
    eval_route_label: auth_session_drift
    eval_tool_label: tool.auth_session_repair
    text: >
      The auth logs include repeated issuer mismatch lines followed by callback
      verification retries. Several traces also show stale jwks cache entries
      surviving after the metadata rotation completed.

  - doc_id: rr-auth-rotation
    task_group: auth_rotation_chain
    task_theme: contest_release_auth_rotation
    title: Runbook excerpt recommends JWKS refresh plus stale session cleanup
    tags: [release, auth, session, runbook, jwks]
    eval_route_label: auth_session_drift
    eval_tool_label: tool.auth_session_repair
    text: >
      The runbook for post-rotation callback regressions says to refresh jwks,
      clear stale session cookies, and rerun callback verification before
      widening rollback. It specifically distinguishes this path from pure auth
      rate limiter regressions.

  - doc_id: rr-auth-rate-limit-false
    task_group: auth_rotation_chain
    task_theme: contest_release_auth_rotation
    title: Earlier login failures were caused by aggressive auth rate limiting
    tags: [release, auth, session, rate-limit, distractor]
    eval_route_label: auth_rate_limit
    eval_tool_label: tool.auth_rate_limit_triage
    text: >
      A previous login incident in the same service came from an aggressive
      backoff window and auth rate limiter tuning mistake. In that case jwks and
      callback verification remained healthy, and the main signal was rate
      limiting rather than issuer mismatch.

  - doc_id: rr-auth-scope
    task_group: auth_rotation_chain
    task_theme: contest_release_auth_rotation
    title: Scope note narrows failures to tenants with cached pre-rotation sessions
    tags: [release, auth, scope, session, jwks]
    eval_route_label: auth_session_drift
    eval_tool_label: tool.auth_session_repair
    text: >
      The follow-up scope note shows most failures cluster in tenants whose
      users carried pre-rotation session cookies into the canary. The safest
      next action is to refresh jwks and clear stale session cookies only on the
      affected canary tenant slice, then re-run callback verification.

  - doc_id: rr-cache-incident
    task_group: inventory_rollout_chain
    task_theme: contest_release_inventory_rollout
    title: Inventory rollout left stale counts after the new sync path shipped
    tags: [release, inventory, cache, invalidation, sync-window]
    eval_route_label: cache_invalidation
    eval_tool_label: tool.cache_invalidation_playbook
    text: >
      The release incident report says inventory pages stayed stale after the
      new sync path shipped to one region. The first responder noted the issue
      follows the batch sync window and looks tied to the inventory aggregate
      path rather than a store write failure.

  - doc_id: rr-cache-metrics
    task_group: inventory_rollout_chain
    task_theme: contest_release_inventory_rollout
    title: Metrics snapshot shows stale inventory after batch sync with healthy writes
    tags: [release, inventory, cache, invalidation, metrics]
    eval_route_label: cache_invalidation
    eval_tool_label: tool.cache_invalidation_playbook
    text: >
      The metrics view shows healthy writer success but stale inventory counters
      on the read side immediately after batch sync. The aggregate invalidation
      rate drops during the same window, while replica lag stays inside normal
      bounds.

  - doc_id: rr-cache-logs
    task_group: inventory_rollout_chain
    task_theme: contest_release_inventory_rollout
    title: Log excerpt points to missing aggregate invalidation hook
    tags: [release, inventory, cache, invalidation, logs]
    eval_route_label: cache_invalidation
    eval_tool_label: tool.cache_invalidation_playbook
    text: >
      The rollout logs include a repeated warning that the post-sync
      invalidation hook skipped the inventory aggregate key on the new path.
      Fresh product writes still commit, but stale inventory views persist until
      manual invalidation runs.

  - doc_id: rr-cache-flag-diff
    task_group: inventory_rollout_chain
    task_theme: contest_release_inventory_rollout
    title: Feature-flag diff moved aggregate invalidation behind the new sync path
    tags: [release, inventory, cache, invalidation, config]
    eval_route_label: cache_invalidation
    eval_tool_label: tool.cache_invalidation_playbook
    text: >
      The feature-flag diff moved the aggregate invalidation hook behind the new
      sync orchestration path. The rollout note says to force inventory
      aggregate invalidation and rerun post-sync validation if stale inventory
      appears without replica lag.

  - doc_id: rr-cache-replica-false
    task_group: inventory_rollout_chain
    task_theme: contest_release_inventory_rollout
    title: Another stale inventory incident was actually read replica lag
    tags: [release, inventory, cache, replica, distractor]
    eval_route_label: cache_replica_stale_read
    eval_tool_label: tool.replica_stale_read_triage
    text: >
      A separate inventory incident after failover was caused by stale reads on
      the reporting replica path. That case had healthy invalidation hooks and a
      visible replica lag rise, so operators routed reads away from the lagging
      replica instead of forcing invalidation.

  - doc_id: rr-cache-scope
    task_group: inventory_rollout_chain
    task_theme: contest_release_inventory_rollout
    title: Scope note isolates the stale inventory path to the rollout region
    tags: [release, inventory, cache, scope, invalidation]
    eval_route_label: cache_invalidation
    eval_tool_label: tool.cache_invalidation_playbook
    text: >
      The scope update shows only the rollout region and the new sync path are
      affected. The safest validation is to force inventory aggregate
      invalidation in that region, rerun the post-sync hook, and verify cache
      freshness before touching replica routing.

  - doc_id: rr-checkout-ambiguous
    task_group: checkout_release_chain
    task_theme: contest_release_checkout_regression
    title: Mixed signal note shows queue pressure without overturning the db path
    tags: [release, checkout, latency, ambiguous, worker, database]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      A later review noted some queue pressure on a subset of workers, but the
      slow orders query and pool wait pattern still aligned much more tightly
      with the failures. The note warns not to switch to the worker path unless
      the database signals clear.

  - doc_id: rr-auth-ambiguous
    task_group: auth_rotation_chain
    task_theme: contest_release_auth_rotation
    title: Mixed signal note shows mild throttling but keeps session drift primary
    tags: [release, auth, ambiguous, session, rate-limit, jwks]
    eval_route_label: auth_session_drift
    eval_tool_label: tool.auth_session_repair
    text: >
      A later auth review recorded a small backoff rise, but stale jwks hits
      and issuer mismatch still lined up far better with the callback failures.
      The note says not to route to pure rate-limit triage unless the drift
      signals fall away.

  - doc_id: rr-billing-incident
    task_group: billing_queue_chain
    task_theme: contest_release_billing_queue_backlog
    title: Billing release introduced invoice queue backlog after worker reload
    tags: [release, billing, queue, worker, canary]
    eval_route_label: worker_queue_starvation
    eval_tool_label: tool.worker_queue_triage
    text: >
      Release 9.2 hit the billing workers and invoice processing delay rose
      quickly on the canary. The incident note says most failed requests sat in
      worker queues behind retry storms rather than blocking on a database write
      path.

  - doc_id: rr-billing-metrics
    task_group: billing_queue_chain
    task_theme: contest_release_billing_queue_backlog
    title: Metrics snapshot shows queue depth surge and retry pressure
    tags: [release, billing, queue, worker, metrics]
    eval_route_label: worker_queue_starvation
    eval_tool_label: tool.worker_queue_triage
    text: >
      The metrics snapshot shows worker queue depth climbing, retry counts
      spiking, and invoice processing threads staying pinned during the reload
      window. Database pool wait stayed close to baseline.

  - doc_id: rr-billing-logs
    task_group: billing_queue_chain
    task_theme: contest_release_billing_queue_backlog
    title: Log excerpt points to retry storms after tls reload
    tags: [release, billing, queue, worker, logs]
    eval_route_label: worker_queue_starvation
    eval_tool_label: tool.worker_queue_triage
    text: >
      The worker logs show repeated retry scheduling after tls reload together
      with queue starvation warnings. Invoice rows eventually commit, but they
      wait behind a growing worker backlog.

  - doc_id: rr-billing-runbook
    task_group: billing_queue_chain
    task_theme: contest_release_billing_queue_backlog
    title: Runbook says to drain retry storms and rebalance invoice workers
    tags: [release, billing, queue, runbook, worker]
    eval_route_label: worker_queue_starvation
    eval_tool_label: tool.worker_queue_triage
    text: >
      The billing runbook says to pause the retry storm trigger, drain the
      affected worker slice, and rebalance invoice consumers before widening
      rollback. It distinguishes this path from database pool incidents.

  - doc_id: rr-billing-db-false
    task_group: billing_queue_chain
    task_theme: contest_release_billing_queue_backlog
    title: Earlier invoice delay incident was driven by database saturation
    tags: [release, billing, queue, database, distractor]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      A previous invoice delay incident in the same service came from a
      database pool collapse. That case had obvious sql wait growth and no retry
      storm or worker queue starvation pattern.

  - doc_id: rr-billing-ambiguous
    task_group: billing_queue_chain
    task_theme: contest_release_billing_queue_backlog
    title: Mixed signal note shows some sql wait without overturning queue backlog
    tags: [release, billing, ambiguous, queue, database, worker]
    eval_route_label: worker_queue_starvation
    eval_tool_label: tool.worker_queue_triage
    text: >
      A later billing review noted a modest sql wait increase, but queue depth,
      retry storms, and worker starvation still explained the dominant delay.
      The note says to stay on the worker path unless the queue signals clear.

  - doc_id: rr-billing-scope
    task_group: billing_queue_chain
    task_theme: contest_release_billing_queue_backlog
    title: Scope note narrows backlog to canary invoice workers
    tags: [release, billing, scope, queue, worker]
    eval_route_label: worker_queue_starvation
    eval_tool_label: tool.worker_queue_triage
    text: >
      The later scope update shows the invoice backlog is limited to the canary
      worker slice after reload. The safest validation is to drain retries and
      rebalance that slice, then verify queue depth returns to baseline.

  - doc_id: rr-deploy-incident
    task_group: deployment_config_chain
    task_theme: contest_release_deployment_config_drift
    title: Deployment config drift introduced pool exhaustion on the canary
    tags: [release, deployment, config, database, canary]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      A deployment config drift reached the canary and the first symptoms were
      pool exhaustion and slow request completion. The incident note points to
      changed connection caps and query-path settings rather than an edge
      worker outage.

  - doc_id: rr-deploy-metrics
    task_group: deployment_config_chain
    task_theme: contest_release_deployment_config_drift
    title: Metrics snapshot shows connection wait growth after config drift
    tags: [release, deployment, config, database, metrics]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      The metrics view shows connection wait growth, sql latency increase, and
      lower pool headroom immediately after the drifted config landed. Worker
      queue depth stayed near the usual range.

  - doc_id: rr-deploy-logs
    task_group: deployment_config_chain
    task_theme: contest_release_deployment_config_drift
    title: Log excerpt shows pool cap mismatch and slow query path activation
    tags: [release, deployment, config, database, logs]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      The deployment logs show the canary loading mismatched pool caps and
      activating a slower query path at the same time. Multiple traces show
      pool wait warnings before the request completes.

  - doc_id: rr-deploy-config
    task_group: deployment_config_chain
    task_theme: contest_release_deployment_config_drift
    title: Drift diff changed pool caps and enabled the slower query path
    tags: [release, deployment, config, database, rollout]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      The diff shows the canary received lower pool caps plus a flag that turns
      on the slower query path. The rollout note says these should be reverted
      together if sql wait and pool exhaustion appear together.

  - doc_id: rr-deploy-worker-false
    task_group: deployment_config_chain
    task_theme: contest_release_deployment_config_drift
    title: Earlier deployment incident came from worker jitter during reload
    tags: [release, deployment, config, worker, distractor]
    eval_route_label: worker_queue_starvation
    eval_tool_label: tool.worker_queue_triage
    text: >
      A previous deployment incident looked similar at first, but the root
      cause there was worker jitter during a reload. That case had healthy pool
      metrics and no slower query path activation.

  - doc_id: rr-deploy-ambiguous
    task_group: deployment_config_chain
    task_theme: contest_release_deployment_config_drift
    title: Mixed signal note shows some worker jitter without overturning pool drift
    tags: [release, deployment, ambiguous, config, worker, database]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      A later review noted mild worker jitter on the canary, but pool wait and
      the slower query path still matched the dominant failures. The note says
      to keep the database route primary unless the pool signals clear.

  - doc_id: rr-deploy-scope
    task_group: deployment_config_chain
    task_theme: contest_release_deployment_config_drift
    title: Scope note narrows config drift to the canary shard only
    tags: [release, deployment, scope, config, database]
    eval_route_label: db_pool_saturation
    eval_tool_label: tool.db_pool_triage
    text: >
      The scope update shows only the canary shard loaded the drifted config.
      The safest validation is to restore the old pool caps on that shard,
      disable the slower query path, and recheck sql wait before widening
      action.
