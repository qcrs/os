- doc_id: rr-cache-flag-diff
  task_group: inventory_rollout_chain
  task_theme: contest_release_inventory_rollout
  title: Flag diff moved aggregate refresh behind the new sync orchestration path
  tags:
  - release
  - inventory
  - config
  - structural-anchor
  - cache
  eval_route_label: cache_invalidation
  eval_tool_label: tool.cache_hook_repair
  text: The feature-flag diff moved aggregate refresh behind the new sync path. The
