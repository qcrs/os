<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="900" viewBox="0 0 1280 900" role="img" aria-labelledby="title desc">
  <title id="title">StateBus Runtime task call graph</title>
  <desc id="desc">任务输入经过 Runtime、角色 Worker、对象存储和模型服务的调用关系。实线表示任务调用、对象写入和运行记录，虚线表示模型路径。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2563EB"/></marker>
    <marker id="arrow-teal" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#2F6F61"/></marker>
    <marker id="arrow-orange" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0,0 L9,4.5 L0,9 z" fill="#C77D2A"/></marker>
    <style>
      .title{font:700 27px Inter,Arial,sans-serif;fill:#0B132B}.sub{font:400 13px Inter,Arial,sans-serif;fill:#64748B}
      .head{font:700 13px Inter,Arial,sans-serif;fill:#0B132B}.node{font:650 14px Inter,Arial,sans-serif;fill:#0F172A}
      .detail{font:400 11px Inter,Arial,sans-serif;fill:#475569}.legend{font:400 12px Inter,Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect width="1280" height="900" rx="24" fill="#F5F7FA"/>
  <text x="42" y="50" class="title">StateBus Runtime</text>
  <text x="42" y="74" class="sub">Runtime 编译任务、签发授权、检查引用、校验产物并记录运行结果。</text>

  <!-- entry -->
  <rect x="42" y="108" width="196" height="80" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="62" y="136" class="head">入口</text><text x="62" y="160" class="node">CLI / Benchmark</text><text x="62" y="178" class="detail">CanonicalTaskSpec</text>
  <rect x="1042" y="108" width="196" height="80" rx="14" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="1062" y="136" class="head">结果文件</text><text x="1062" y="160" class="node">Evidence JSON / Markdown</text><text x="1062" y="178" class="detail">tests/evidence/ + runs/</text>

  <!-- runtime -->
  <rect x="42" y="220" width="1196" height="158" rx="18" fill="#E8F0FF" stroke="#2563EB" stroke-width="2"/>
  <text x="66" y="248" class="head">Runtime：任务编译、授权与记录</text>
  <g transform="translate(68 270)">
    <rect width="180" height="70" rx="11" fill="#FFFFFF" stroke="#2563EB"/><text x="16" y="299" class="node">TaskCompiler</text><text x="16" y="320" class="detail">CanonicalTaskSpec</text>
    <rect x="218" width="180" height="70" rx="11" fill="#FFFFFF" stroke="#2563EB"/><text x="234" y="299" class="node">PlanPolicy</text><text x="234" y="320" class="detail">ApprovedPlan</text>
    <rect x="436" width="180" height="70" rx="11" fill="#FFFFFF" stroke="#2563EB"/><text x="452" y="299" class="node">Dispatcher</text><text x="452" y="320" class="detail">step / attempt</text>
    <rect x="654" width="180" height="70" rx="11" fill="#FFFFFF" stroke="#2563EB"/><text x="670" y="299" class="node">Supervisor</text><text x="670" y="320" class="detail">worker lifecycle</text>
    <rect x="872" width="180" height="70" rx="11" fill="#FFFFFF" stroke="#2563EB"/><text x="888" y="299" class="node">Telemetry</text><text x="888" y="320" class="detail">events / ledger</text>
    <path d="M180 35H218M398 35H436M616 35H654M834 35H872" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  </g>

  <!-- messages and grants -->
  <rect x="42" y="414" width="370" height="156" rx="16" fill="#E8F5F0" stroke="#2F6F61"/>
  <text x="66" y="443" class="head">消息与授权 · UDS + Typed Protobuf</text>
  <rect x="66" y="462" width="145" height="58" rx="9" fill="#FFFFFF" stroke="#2F6F61"/><text x="80" y="487" class="node">CapabilityGrant</text><text x="80" y="506" class="detail">Ref / schema / budget</text>
  <rect x="235" y="462" width="145" height="58" rx="9" fill="#FFFFFF" stroke="#2F6F61"/><text x="249" y="487" class="node">ExecRequest</text><text x="249" y="506" class="detail">ACK / heartbeat / result</text>
  <path d="M211 491H235" fill="none" stroke="#2F6F61" stroke-width="2" marker-end="url(#arrow-teal)"/>

  <!-- role workers -->
  <rect x="442" y="414" width="396" height="156" rx="16" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="466" y="443" class="head">角色 Worker</text>
  <g transform="translate(466 462)">
    <rect width="82" height="58" rx="9" fill="#F5F7FA" stroke="#CBD5E1"/><text x="41" y="496" text-anchor="middle" class="node">Planner</text>
    <rect x="94" width="82" height="58" rx="9" fill="#F5F7FA" stroke="#CBD5E1"/><text x="135" y="496" text-anchor="middle" class="node">Retriever</text>
    <rect x="188" width="82" height="58" rx="9" fill="#F5F7FA" stroke="#CBD5E1"/><text x="229" y="496" text-anchor="middle" class="node">Executor</text>
    <rect x="282" width="82" height="58" rx="9" fill="#F5F7FA" stroke="#CBD5E1"/><text x="323" y="496" text-anchor="middle" class="node">Summarizer</text>
  </g>

  <!-- model -->
  <rect x="868" y="414" width="370" height="156" rx="16" fill="#F2ECFF" stroke="#7C3AED"/>
  <text x="892" y="443" class="head">模型服务</text>
  <rect x="892" y="462" width="322" height="58" rx="9" fill="#FFFFFF" stroke="#7C3AED"/><text x="908" y="487" class="node">vLLM 0.9.2 · Qwen3-32B</text><text x="908" y="506" class="detail">OpenAI-compatible API</text>

  <!-- state and artifacts -->
  <rect x="42" y="610" width="560" height="190" rx="16" fill="#E9F7F6" stroke="#0F766E"/>
  <text x="66" y="640" class="head">状态与产物 · 大对象与文件</text>
  <rect x="66" y="660" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#0F766E"/><text x="81" y="686" class="node">EvidencePack</text><text x="81" y="705" class="detail">locator / hydration</text>
  <rect x="230" y="660" width="150" height="62" rx="9" fill="#FFFFFF" stroke="#0F766E"/><text x="245" y="686" class="node">SemanticStateRef</text><text x="245" y="705" class="detail">row / receipt</text>
  <rect x="394" y="660" width="174" height="62" rx="9" fill="#FFFFFF" stroke="#0F766E"/><text x="409" y="686" class="node">ArtifactRef</text><text x="409" y="705" class="detail">workspace / SHA-256</text>
  <path d="M216 691H230M380 691H394" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="66" y="758" class="detail">shared memory · mmap · CAS · attempt workspace</text>

  <!-- memory store -->
  <rect x="630" y="610" width="608" height="190" rx="16" fill="#FFF4E5" stroke="#C77D2A"/>
  <text x="654" y="640" class="head">MemoryStore：候选与重放</text>
  <rect x="654" y="660" width="164" height="62" rx="9" fill="#FFFFFF" stroke="#C77D2A"/><text x="669" y="686" class="node">MemoryStore</text><text x="669" y="705" class="detail">SQLite / FTS / vector</text>
  <rect x="836" y="660" width="164" height="62" rx="9" fill="#FFFFFF" stroke="#C77D2A"/><text x="851" y="686" class="node">Compatibility</text><text x="851" y="705" class="detail">schema / signature</text>
  <rect x="1018" y="660" width="196" height="62" rx="9" fill="#FFFFFF" stroke="#C77D2A"/><text x="1033" y="686" class="node">Validated replay</text><text x="1033" y="705" class="detail">recipe / provenance</text>
  <path d="M818 691H836M1000 691H1018" fill="none" stroke="#C77D2A" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="654" y="758" class="detail">candidate lookup → compatibility check → validated replay / commit</text>

  <!-- relationships -->
  <path d="M140 188V220" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1140 188V220" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M412 492H442" fill="none" stroke="#2F6F61" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <path d="M838 492H868" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M640 570V610" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <path d="M1010 570V610" fill="none" stroke="#7C3AED" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 570V645" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-teal)"/>
  <path d="M740 570V645" fill="none" stroke="#C77D2A" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arrow-orange)"/>

  <!-- model paths -->
  <rect x="42" y="830" width="1196" height="42" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <line x1="70" y1="851" x2="126" y2="851" stroke="#2563EB" stroke-width="2"/><text x="138" y="856" class="legend">实线：任务调用、对象写入与运行记录</text>
  <line x1="430" y1="851" x2="486" y2="851" stroke="#C77D2A" stroke-width="2" stroke-dasharray="7 6"/><text x="498" y="856" class="legend">虚线：模型路径（Embedding / APC / Logit / EngineLocalKVHandle）</text>
</svg>
