<svg xmlns="http://www.w3.org/2000/svg" width="860" height="220" viewBox="0 0 860 220" role="img" aria-labelledby="title desc">
  <title id="title">StateBus Runtime</title>
  <desc id="desc">StateBus Runtime 的控制消息、状态对象和共享记忆。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B132B"/>
      <stop offset="1" stop-color="#162A4A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="860" height="220" rx="28" fill="url(#bg)"/>
  <path d="M42 176H818" stroke="#294464" stroke-width="2"/>
  <g transform="translate(48 42)" filter="url(#shadow)">
    <rect width="136" height="136" rx="30" fill="#102747" stroke="#3B82F6" stroke-width="3"/>
    <path d="M30 68H106" stroke="#F8FAFC" stroke-width="7" stroke-linecap="round"/>
    <path d="M30 68V42M68 68V96M106 68V42" stroke="#67E8F9" stroke-width="5" stroke-linecap="round"/>
    <circle cx="30" cy="68" r="10" fill="#38BDF8"/>
    <circle cx="68" cy="68" r="10" fill="#2DD4BF"/>
    <circle cx="106" cy="68" r="10" fill="#FBBF24"/>
    <text x="68" y="121" text-anchor="middle" fill="#CBD5E1" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">RUNTIME</text>
  </g>
  <g transform="translate(232 55)">
    <text x="0" y="60" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="750" letter-spacing="0">StateBus</text>
    <text x="3" y="101" fill="#67E8F9" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" letter-spacing="4">TYPED WORKFLOWS</text>
    <text x="3" y="135" fill="#CBD5E1" font-family="Inter,Arial,sans-serif" font-size="16">messages · state · artifacts · memory</text>
  </g>
  <g transform="translate(666 65)">
    <rect width="136" height="92" rx="18" fill="#102747" stroke="#294464"/>
    <text x="18" y="29" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5">OBJECTS</text>
    <text x="18" y="54" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">StateRef</text>
    <text x="18" y="76" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="650">ArtifactRef</text>
  </g>
</svg>
