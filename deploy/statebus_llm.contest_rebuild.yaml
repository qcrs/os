mode: local_vllm

# Formal four-role requests use Qwen3's non-thinking chat template. Changing
# any role to thinking mode creates a different experiment treatment and must
# never be mixed into the canonical P/L/R matrix or historical comparisons.

providers:
  default:
    kind: openai_compatible
    base_url: http://127.0.0.1:53334/v1
    api_key: EMPTY
    timeout_s: 120
    request_max_attempts: 1

roles:
  planner:
    provider: default
    model: qwen3-32b
    json_output: true
    temperature: 0.0
    max_tokens: 1024
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  retriever:
    provider: default
    model: qwen3-32b
    json_output: true
    temperature: 0.0
    max_tokens: 1024
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  executor:
    provider: default
    model: qwen3-32b
    json_output: true
    temperature: 0.0
    max_tokens: 1536
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
  summarizer:
    provider: default
    model: qwen3-32b
    json_output: true
    temperature: 0.0
    max_tokens: 1024
    extra_body:
      chat_template_kwargs:
        enable_thinking: false
