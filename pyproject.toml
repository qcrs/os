[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "statebus"
version = "0.1.0"
description = "Typed state-transfer runtime for multi-agent workflows"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "protobuf",
  "pydantic>=2",
  "msgpack",
  "openai",
  "faiss-cpu",
  "transformers>=4.51.3,<5",
  "sentence-transformers==5.5.1",
  "pyyaml",
]

[project.optional-dependencies]
langgraph = [
  "langgraph>=0.2,<0.4",
]

[project.scripts]
statebus-smoke = "statebus.runtime.smoke:main"
statebus-benchmark = "statebus.benchmark.live_runner:main"

[tool.setuptools]
include-package-data = true
py-modules = []

[tool.setuptools.packages.find]
include = ["statebus*"]

[tool.setuptools.package-data]
statebus = [
  "benchmark/samples/**/*",
  "control/*.proto",
  "studio/data/*.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["third_party"]
